<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Basquete Kids — Alemãozinho Pedro</title>
  <!-- Bootstrap Icons via CDN oficial -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <style>
    :root {
      /* Paleta GitHub Dark Mode */
      --gh-bg-canvas: #0d1117;
      --gh-bg-subtle: #161b22;
      --gh-bg-elevated: #1c2128;
      --gh-bg-overlay: #21262d;
      --gh-border-default: #30363d;
      --gh-border-muted: #21262d;
      --gh-text-primary: #e6edf3;
      --gh-text-secondary: #8b949e;
      --gh-text-muted: #6e7681;

      /* Cores da Alemanha */
      --de-black: #000000;
      --de-red: #dd0000;
      --de-gold: #ffce00;

      /* Cores do Basquete & Placar */
      --bball-orange: #f26419;
      --bball-rim: #e63946;
      --led-gold: #ffce00;
      --led-blue: #38bdf8;
      --led-green: #4ade80;
      --led-red: #ff3344;

      --font-brand: 'Georgia', 'Times New Roman', Times, serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--gh-bg-canvas);
      color: var(--gh-text-primary);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Cabeçalho Superior */
    .top-header {
      background-color: var(--gh-bg-subtle);
      border-bottom: 1px solid var(--gh-border-default);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 30;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--gh-text-secondary);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      background-color: var(--gh-bg-overlay);
      border: 1px solid var(--gh-border-default);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      border-color: var(--de-gold);
      color: var(--de-gold);
      background-color: var(--gh-bg-elevated);
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .game-logo-title {
      font-family: var(--font-brand);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gh-text-primary);
    }

    .game-logo-title span {
      color: var(--de-gold);
    }

    .author-badge {
      font-size: 0.72rem;
      color: var(--de-red);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background-color: var(--gh-bg-overlay);
      border: 1px solid var(--gh-border-default);
      color: var(--gh-text-primary);
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      border-color: var(--de-gold);
      color: var(--de-gold);
      background-color: var(--gh-bg-elevated);
    }

    /* Placar Estilo Ginásio NBA */
    .scoreboard-bar {
      background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
      border-bottom: 2px solid var(--gh-border-default);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      z-index: 25;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .score-block {
      background-color: #0b0e14;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 4px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 82px;
      position: relative;
    }

    .score-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gh-text-secondary);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .score-value {
      font-family: var(--font-mono);
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--led-gold);
      text-shadow: 0 0 10px rgba(255, 206, 0, 0.4);
      line-height: 1.1;
    }

    .score-value.timer {
      color: var(--led-blue);
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .score-value.timer.hurry {
      color: var(--led-red);
      animation: pulseTimer 0.6s infinite alternate;
      text-shadow: 0 0 12px rgba(255, 51, 68, 0.7);
    }

    @keyframes pulseTimer {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .score-value.goal {
      color: var(--led-green);
    }

    .score-value.level {
      color: #f43f5e;
    }

    .score-value.best {
      color: #e2e8f0;
      font-size: 1.25rem;
    }

    /* Posição Ativa & Teleporte */
    .teleport-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #0b0e14;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 4px 8px;
    }

    .teleport-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--gh-text-secondary);
      background-color: var(--gh-bg-overlay);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .teleport-pill:hover {
      color: var(--gh-text-primary);
      border-color: var(--gh-border-default);
    }

    .teleport-pill.active {
      background: linear-gradient(135deg, #dd0000 0%, #b30000 100%);
      color: #ffffff;
      border-color: var(--de-gold);
      box-shadow: 0 0 8px rgba(221, 0, 0, 0.5);
    }

    .teleport-pill.active .pt-num {
      color: var(--de-gold);
    }

    /* Arena do Jogo */
    .arena-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #7bb5e6;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlay HUD e Controles */
    .hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 18px;
    }

    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    /* Painel de Calibragem das Setas */
    .calib-panel {
      pointer-events: auto;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--gh-border-default);
      border-radius: 10px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .calib-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--de-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .aim-status-badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #21262d;
      color: var(--gh-text-secondary);
    }

    .aim-status-badge.visible {
      color: var(--led-green);
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .aim-status-badge.peeking {
      color: var(--de-gold);
      background: rgba(255, 206, 0, 0.15);
      border: 1px solid var(--de-gold);
    }

    .aim-status-badge.hidden {
      color: var(--gh-text-muted);
    }

    .calib-bars-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 175px;
    }

    .calib-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--gh-text-secondary);
    }

    .calib-meter {
      width: 100px;
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
      border: 1px solid #30363d;
    }

    .calib-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, #dd0000, #ffce00, #4ade80);
      transition: width 0.1s ease, left 0.1s ease;
    }

    .calib-meter-center {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: #ffffff;
      transform: translateX(-50%);
      z-index: 2;
    }

    .hud-hints-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .badge-hint {
      pointer-events: auto;
      background-color: rgba(22, 27, 34, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid var(--gh-border-default);
      color: var(--gh-text-secondary);
      font-size: 0.78rem;
      padding: 5px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-hint kbd {
      background-color: #0b0e14;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--de-gold);
    }

    .hud-bottom-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    /* D-Pad Virtual de Setas para Telas Touch */
    .dpad-cluster {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(2, 40px);
      gap: 4px;
    }

    .dpad-btn {
      background-color: rgba(22, 27, 34, 0.88);
      border: 1px solid var(--gh-border-default);
      color: var(--gh-text-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .dpad-btn:active,
    .dpad-btn.pressed {
      background-color: var(--de-red);
      color: #ffffff;
      border-color: var(--de-gold);
      transform: scale(0.95);
    }

    /* Botão Principal de Ação (Arremessar ou Nova Jogada) */
    .action-button-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-peek-aim {
      pointer-events: auto;
      background: var(--gh-bg-overlay);
      border: 1px solid var(--gh-border-default);
      color: var(--gh-text-secondary);
      padding: 12px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-peek-aim:hover,
    .btn-peek-aim:active {
      border-color: var(--de-gold);
      color: var(--de-gold);
    }

    .btn-main-action {
      pointer-events: auto;
      background: linear-gradient(135deg, #f26419 0%, #d44a04 100%);
      color: #ffffff;
      border: 2px solid #ffce00;
      border-radius: 50px;
      padding: 14px 28px;
      font-family: var(--font-brand);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 6px 20px rgba(242, 100, 25, 0.5);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
    }

    .btn-main-action:hover,
    .btn-main-action:active {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(255, 206, 0, 0.65);
      border-color: #ffffff;
    }

    .btn-main-action.next-play {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-color: #38bdf8;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    /* Popups de Acerto / Erro */
    .score-popup {
      position: absolute;
      font-family: var(--font-brand);
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      pointer-events: none;
      animation: floatScore 1.3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      z-index: 50;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
    }

    @keyframes floatScore {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px) scale(0.6);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -20px) scale(1.15);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -60px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -90px) scale(0.85);
      }
    }

    /* Modal de Nível / Fim de Jogo */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background-color: rgba(13, 17, 23, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--gh-bg-subtle);
      border: 2px solid var(--gh-border-default);
      border-radius: 12px;
      max-width: 460px;
      width: 100%;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1);
    }

    .modal-icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      border: 2px solid var(--gh-border-default);
    }

    .modal-icon-wrap.win {
      background: radial-gradient(circle, rgba(255, 206, 0, 0.2) 0%, rgba(221, 0, 0, 0.1) 100%);
      border-color: var(--de-gold);
      color: var(--de-gold);
    }

    .modal-icon-wrap.try {
      background-color: var(--gh-bg-overlay);
      border-color: var(--de-red);
      color: var(--de-red);
    }

    .modal-title {
      font-family: var(--font-brand);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gh-text-primary);
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 0.95rem;
      color: var(--gh-text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .modal-stats {
      background-color: var(--gh-bg-canvas);
      border: 1px solid var(--gh-border-default);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .stat-cell-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gh-text-muted);
      margin-bottom: 2px;
    }

    .stat-cell-val {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--gh-text-primary);
    }

    .btn-modal {
      width: 100%;
      background: linear-gradient(135deg, #dd0000 0%, #b30000 100%);
      color: #ffffff;
      border: 1px solid var(--de-gold);
      border-radius: 8px;
      padding: 12px 20px;
      font-family: var(--font-brand);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(221, 0, 0, 0.4);
    }

    .btn-modal:hover {
      background: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 206, 0, 0.5);
    }

    #confettiCanvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 120;
    }

    @media (max-width: 768px) {
      .top-header { padding: 6px 12px; }
      .author-badge, .hud-hints-cluster { display: none; }
      .scoreboard-bar { padding: 6px 8px; gap: 6px; }
      .score-block { min-width: 62px; padding: 3px 6px; }
      .score-value { font-size: 1.15rem; }
      .btn-main-action { padding: 10px 18px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- Top Bar Oficial PedroPlay -->
  <header class="top-header">
    <div class="header-left">
      <a href="index.html" class="back-btn" title="Voltar para a central de jogos">
        <i class="bi bi-arrow-left"></i>
        <span>Central</span>
      </a>

      <div class="title-group">
        <h1 class="game-logo-title">Basquete<span>Kids</span></h1>
        <span class="author-badge">Alemãozinho Pedro</span>
      </div>
    </div>

    <div class="header-right">
      <button class="btn-icon" id="btnSoundToggle" title="Ativar ou desativar efeitos sonoros" aria-label="Som">
        <i class="bi bi-volume-up" id="soundIcon"></i>
      </button>

      <button class="btn-icon" id="btnRestart" title="Reiniciar partida (Tecla R)" aria-label="Reiniciar">
        <i class="bi bi-arrow-counterclockwise"></i>
      </button>
    </div>
  </header>

  <!-- Placar Ginásio NBA -->
  <section class="scoreboard-bar" aria-label="Placar do jogo">
    <!-- Nível / Fase -->
    <div class="score-block" title="Fase atual">
      <span class="score-label"><i class="bi bi-flag"></i> Fase</span>
      <span class="score-value level" id="valLevel">1</span>
    </div>

    <!-- Pontos -->
    <div class="score-block" title="Pontos na rodada">
      <span class="score-label"><i class="bi bi-star-fill"></i> Pontos</span>
      <span class="score-value" id="valScore">0</span>
    </div>

    <!-- Meta -->
    <div class="score-block" title="Meta de pontos para passar de nível">
      <span class="score-label"><i class="bi bi-bullseye"></i> Meta</span>
      <span class="score-value goal" id="valGoal">6</span>
    </div>

    <!-- Cronômetro 60s -->
    <div class="score-block" title="Tempo restante (60 segundos)">
      <span class="score-label"><i class="bi bi-clock"></i> Tempo</span>
      <span class="score-value timer" id="valTimer">60</span>
    </div>

    <!-- Teleporte de Distância (1, 2, 3) -->
    <div class="teleport-indicator" title="Posição de arremesso">
      <button class="teleport-pill active" id="btnPos1" data-pos="1" title="Perto da cesta: 1 ponto (Tecla 1)">
        <i class="bi bi-1-circle-fill"></i>
        <span>Lance Livre (<strong class="pt-num">1 pt</strong>)</span>
      </button>

      <button class="teleport-pill" id="btnPos2" data-pos="2" title="Média distância: 2 pontos (Tecla 2)">
        <i class="bi bi-2-circle-fill"></i>
        <span>Garrafão (<strong class="pt-num">2 pts</strong>)</span>
      </button>

      <button class="teleport-pill" id="btnPos3" data-pos="3" title="Linha dos três: 3 pontos (Tecla 3)">
        <i class="bi bi-3-circle-fill"></i>
        <span>Três Pontos (<strong class="pt-num">3 pts</strong>)</span>
      </button>
    </div>

    <!-- Recorde -->
    <div class="score-block" title="Seu recorde máximo">
      <span class="score-label"><i class="bi bi-trophy"></i> Recorde</span>
      <span class="score-value best" id="valHigh">0</span>
    </div>
  </section>

  <!-- Área Principal da Quadra / Arena -->
  <main class="arena-container" id="arena">
    <canvas id="gameCanvas"></canvas>

    <!-- Overlay HUD -->
    <div class="hud-overlay">
      <div class="hud-top-row">
        <!-- Painel de Calibragem das Setas -->
        <div class="calib-panel" title="Calibre a mira da bola com as setas">
          <div class="calib-title">
            <span><i class="bi bi-sliders2"></i> Calibragem</span>
            <span class="aim-status-badge visible" id="aimBadge">Mira Ativa</span>
          </div>
          <div class="calib-bars-wrap">
            <div class="calib-row">
              <span>Horizontal (<kbd>←</kbd> <kbd>→</kbd>)</span>
              <div class="calib-meter">

  <script>
    /**
     * PedroPlay — Basquete Kids
     * - Imagem real dos braços e da bola (img/basket.png) com fundo transparente!
     * - A imagem desaparece ao arremessar (barra de espaço).
     * - Barra de espaço inicia nova jogada: nova posição na quadra e a imagem emerge de baixo!
     * - FÍSICA REAL DIRETA: O arremesso sai reto a partir de onde o jogador está.
     *   Se estiver na esquerda e não calibrar com as setas, a bola voa reto pela esquerda e erra feio!
     *   Seta ↑ sobe a trajetória (podendo passar por cima da tabela).
     *   Seta ↓ desce a trajetória (podendo passar por debaixo da tabela).
     * - Alvo didático: Fase 1 ativo, Fase 2 vislumbre rápido (ou Shift para espiar), Fase 3 sem alvo!
     */

    /* ==========================================================================
       1. Motor de Efeitos Sonoros Acústicos (Web Audio API)
       ========================================================================== */
    class BasketballAudio {
      constructor() {
        this.ctx = null;
        this.muted = localStorage.getItem('basketball_sound_muted') === 'true';
        this.updateIcon();
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem('basketball_sound_muted', this.muted);
        this.updateIcon();
        if (!this.muted) this.playSwish();
      }

      updateIcon() {
        const icon = document.getElementById('soundIcon');
        if (icon) {
          icon.className = this.muted ? 'bi bi-volume-mute' : 'bi bi-volume-up';
        }
      }

      playSwish() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const bufferSize = this.ctx.sampleRate * 0.35;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.08));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2200, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.3);
        filter.Q.value = 3.2;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.75, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playRim() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(360, this.ctx.currentTime + 0.22);

        gain.gain.setValueAtTime(0.55, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.24);
      }

      playBackboard() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(65, this.ctx.currentTime + 0.14);

        gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }

      playBounce() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.09);

        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, this.ctx.currentTime + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }

      playJumpShoot() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.16);

        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }

      playEmerge() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(340, this.ctx.currentTime + 0.2);

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.24);
      }

      playTick() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.035);
      }

      playWhistle() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(2700, this.ctx.currentTime);
        osc2.frequency.setValueAtTime(2760, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.38);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start();
        osc2.start();
        osc1.stop(this.ctx.currentTime + 0.4);
        osc2.stop(this.ctx.currentTime + 0.4);
      }

      playCheer() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const start = this.ctx.currentTime + idx * 0.1;
          gain.gain.setValueAtTime(0.25, start);
          gain.gain.exponentialRampToValueAtTime(0.01, start + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.38);
        });
      }
    }

    /* ==========================================================================
       2. Confetes de Vitória
       ========================================================================== */
    class ConfettiEffect {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.animId = null;
        this.colors = ['#ffce00', '#dd0000', '#ffffff', '#00ff66', '#38bdf8', '#f26419'];
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      burst() {
        this.resize();
        this.particles = [];
        for (let i = 0; i < 90; i++) {
          this.particles.push({
            x: this.canvas.width * (0.3 + Math.random() * 0.4),
            y: this.canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 16,
            vy: -Math.random() * 14 - 4,
            size: Math.random() * 8 + 4,
            color: this.colors[Math.floor(Math.random() * this.colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 12,
            opacity: 1
          });
        }
        if (!this.animId) this.loop();
      }

      loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        let active = 0;

        for (let p of this.particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.4;
          p.rotation += p.vRot;
          p.opacity -= 0.008;

          if (p.opacity > 0 && p.y < this.canvas.height) {
            active++;
            this.ctx.save();
            this.ctx.translate(p.x, p.y);
            this.ctx.rotate((p.rotation * Math.PI) / 180);
            this.ctx.globalAlpha = Math.max(0, p.opacity);
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
            this.ctx.restore();
          }
        }

        if (active > 0) {
          this.animId = requestAnimationFrame(() => this.loop());
        } else {
          this.animId = null;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    /* ==========================================================================
       3. Motor Principal do Basquete Kids
       ========================================================================== */
    class BasketballGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new BasketballAudio();
        this.confetti = new ConfettiEffect('confettiCanvas');

        // Carrega imagem real dos braços e da bola (img/basket.png)
        this.basketImg = new Image();
        this.basketImg.src = 'img/basket.png';
        this.basketImg.onerror = () => {
          this.basketImg.src = 'https://raw.githubusercontent.com/patricschurhaus/pedroplay/main/img/basket.png';
        };

        // Estado do Jogo
        this.score = 0;
        this.highScore = parseInt(localStorage.getItem('pedroplay_basketball_highscore') || '0', 10);
        this.basketsCount = 0;
        this.level = 1;
        this.timeLeft = 60;
        this.timerInterval = null;
        this.isGameOver = false;

        // Metas de cada nível
        this.levelConfigs = [
          { level: 1, name: 'Iniciante na Quadra', goal: 6, time: 60 },
          { level: 2, name: 'Armador Talentoso', goal: 14, time: 60 },
          { level: 3, name: 'Estrela da Cesta', goal: 22, time: 60 },
          { level: 4, name: 'Lenda da NBA', goal: 32, time: 60 }
        ];

        // Posição de Distância Selecionada (1, 2 ou 3)
        this.currentDistancePreset = 1;
        this.targetCameraZ = 290;
        this.cameraZ = 290;

        // Posição Dinâmica do Jogador na Quadra (muda a cada nova jogada!)
        this.playerCourtX = 0;
        this.targetPlayerCourtX = 0;
        this.cameraX = 0;

        // Estados do Ciclo de Jogada:
        // 'HOLDING' (Bola nas mãos mirando), 'EMERGING' (Bola subindo),
        // 'IN_FLIGHT' (Bola no ar arremessada), 'WAITING_NEXT' (Aguardando Espaço para nova jogada)
        this.playState = 'HOLDING';

        // Animação de bola emergindo da parte inferior
        this.emergeProgress = 1.0;

        // Pulo no Ar (Jump Shot)
        this.jump = {
          active: false,
          progress: 0,
          height: 0
        };

        // Calibragem da Trajetória via Setas (← ↑ ↓ →)
        // 0 = arremesso reto para a frente a partir da posição do jogador
        this.calibX = 0;
        this.calibY = 0;

        // Sistema do Alvo de Mira por Fase
        this.aimTimer = 2.0;
        this.isPeeking = false;

        // Bolas de Basquete ativas
        this.balls = [];

        // Geometria da Cesta 3D (Cesta no centro da quadra x = 0)
        this.hoop = {
          x: 0,
          y: 290,           // Altura do aro
          z: 550,           // Profundidade do aro
          rimRadius: 32,    // Raio do aro de metal
          backboardWidth: 220,
          backboardHeight: 150,
          backboardY: 340,  // Centro da tabela (topo = 415, base = 265)
          backboardZ: 575   // Tabela logo atrás do aro
        };

        this.netWave = 0;

        // Elementos DOM
        this.dom = {
          valScore: document.getElementById('valScore'),
          valHigh: document.getElementById('valHigh'),
          valLevel: document.getElementById('valLevel'),
          valGoal: document.getElementById('valGoal'),
          valTimer: document.getElementById('valTimer'),
          meterHoriz: document.getElementById('meterHoriz'),
          meterVert: document.getElementById('meterVert'),
          aimBadge: document.getElementById('aimBadge'),
          btnPos1: document.getElementById('btnPos1'),
          btnPos2: document.getElementById('btnPos2'),
          btnPos3: document.getElementById('btnPos3'),
          btnMainAction: document.getElementById('btnMainAction'),
          actionIcon: document.getElementById('actionIcon'),
          actionBtnText: document.getElementById('actionBtnText'),
          hintActionText: document.getElementById('hintActionText'),
          btnPeekAim: document.getElementById('btnPeekAim'),
          modal: document.getElementById('resultModal'),
          modalTitle: document.getElementById('modalTitle'),
          modalDesc: document.getElementById('modalDesc'),
          modalBaskets: document.getElementById('modalBaskets'),
          modalScore: document.getElementById('modalScore'),
          modalHigh: document.getElementById('modalHigh'),
          modalIcon: document.getElementById('modalIcon'),
          modalIconGlyph: document.getElementById('modalIconGlyph'),
          btnModalAction: document.getElementById('btnModalAction'),
          modalBtnText: document.getElementById('modalBtnText')
        };

        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupControls();
        this.updateHUD();
        this.updateCalibrationMeters();
        this.startLevel(1);

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.gameLoop(t));
      }

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;
        this.centerX = this.canvas.width / 2;
        this.horizonY = this.canvas.height * 0.44;
      }

      setupControls() {
        window.addEventListener('keydown', (e) => {
          let adjusted = false;

          if (this.playState === 'HOLDING') {
            // Calibragem nas Setas
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
              this.calibX = Math.max(-60, this.calibX - 3.5);
              adjusted = true;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
              this.calibX = Math.min(60, this.calibX + 3.5);
              adjusted = true;
            } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
              // Seta ↑ arremessa mais alto (podendo passar por cima da tabela)
              this.calibY = Math.min(60, this.calibY + 3.5);
              adjusted = true;
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
              // Seta ↓ arremessa mais baixo (podendo passar por baixo da tabela)
              this.calibY = Math.max(-60, this.calibY - 3.5);
              adjusted = true;
            }
          }

          if (e.code === 'Space') {
            e.preventDefault();
            this.handleSpaceAction();
          } else if (e.key === 'Shift') {
            this.isPeeking = true;
          } else if (e.key === '1') {
            this.setShootingDistancePreset(1);
          } else if (e.key === '2') {
            this.setShootingDistancePreset(2);
          } else if (e.key === '3') {
            this.setShootingDistancePreset(3);
          } else if (e.key === 'r' || e.key === 'R') {
            this.restartGame();
          }

          if (adjusted) {
            this.audio.playTick();
            this.updateCalibrationMeters();
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.key === 'Shift') {
            this.isPeeking = false;
          }
        });

        // D-Pad Virtual (Touch)
        const bindDpad = (id, dx, dy) => {
          const btn = document.getElementById(id);
          if (btn) {
            const act = () => {
              if (this.playState !== 'HOLDING') return;
              if (dx !== 0) this.calibX = Math.max(-60, Math.min(60, this.calibX + dx));
              if (dy !== 0) this.calibY = Math.max(-60, Math.min(60, this.calibY + dy));
              this.audio.playTick();
              this.updateCalibrationMeters();
            };
            btn.addEventListener('click', act);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); act(); }, { passive: false });
          }
        };

        bindDpad('dpadLeft', -4.5, 0);
        bindDpad('dpadRight', 4.5, 0);
        bindDpad('dpadUp', 0, 4.5);
        bindDpad('dpadDown', 0, -4.5);

        // Botão Principal de Ação
        this.dom.btnMainAction.addEventListener('click', () => this.handleSpaceAction());

        // Botão Espiar Mira (Mobile / Fase 2)
        const btnPeek = this.dom.btnPeekAim;
        btnPeek.addEventListener('mousedown', () => { this.isPeeking = true; });
        window.addEventListener('mouseup', () => { this.isPeeking = false; });
        btnPeek.addEventListener('touchstart', (e) => { e.preventDefault(); this.isPeeking = true; }, { passive: false });
        window.addEventListener('touchend', () => { this.isPeeking = false; });

        // Clique no canvas
        this.canvas.addEventListener('mousedown', (e) => {
          if (e.button === 0 && !this.isGameOver) {
            this.handleSpaceAction();
          }
        });

        // Teleportes 1, 2, 3
        this.dom.btnPos1.addEventListener('click', () => this.setShootingDistancePreset(1));
        this.dom.btnPos2.addEventListener('click', () => this.setShootingDistancePreset(2));
        this.dom.btnPos3.addEventListener('click', () => this.setShootingDistancePreset(3));

        // Cabeçalho
        document.getElementById('btnSoundToggle').addEventListener('click', () => this.audio.toggleMute());
        document.getElementById('btnRestart').addEventListener('click', () => this.restartGame());

        // Modal
        this.dom.btnModalAction.addEventListener('click', () => {
          this.dom.modal.classList.remove('active');
          if (this.currentWin) {
            this.startLevel(this.level + 1);
          } else {
            this.startLevel(this.level);
          }
        });
      }

      /* ==========================================================================
         4. Gerenciador de Ciclo: Arremessar -> Desaparecer -> Nova Bola Emerge
         ========================================================================== */
      handleSpaceAction() {
        if (this.isGameOver) return;

        if (this.playState === 'HOLDING') {
          // Arremessa a bola que está nas mãos!
          this.triggerJumpShoot();
        } else if (this.playState === 'WAITING_NEXT') {
          // Pressiona barra de espaço novamente: surge nova bola de baixo e nova posição!
          this.startNewPlay();
        }
      }

      startNewPlay() {
        this.playState = 'EMERGING';
        this.emergeProgress = 0;
        this.audio.playEmerge();

        // Nova posição aleatória na quadra a cada jogada!
        // Varia entre esquerda, centro e direita
        const positions = [-150, -110, -60, 0, 60, 110, 150];
        this.targetPlayerCourtX = positions[Math.floor(Math.random() * positions.length)];

        // Reseta calibragem para 0 (tiro reto a partir da nova posição)
        // Como o jogador está fora do centro, arremessar sem calibrar vai errar feio!
        this.calibX = 0;
        this.calibY = 0;
        this.updateCalibrationMeters();

        this.aimTimer = 2.0;
        this.updateActionUI('HOLDING');
      }

      triggerJumpShoot() {
        if (this.jump.active) return;

        this.jump.active = true;
        this.jump.progress = 0;
        this.audio.playJumpShoot();

        // No momento em que solta a bola, a imagem em primeira pessoa DESAPARECE!
        setTimeout(() => {
          this.releaseBall();
          // Imagem desaparece imediatamente!
          this.playState = 'IN_FLIGHT';
          this.updateActionUI('IN_FLIGHT');
        }, 160);
      }

      releaseBall() {
        const distZ = this.hoop.z - this.cameraZ;
        const flightTime = 0.82 + (distZ / 500) * 0.35;
        const vz = distZ / flightTime;
        const gravity = 860;

        // Posição de lançamento (onde o jogador está na quadra)
        const startX = this.playerCourtX;
        const startY = 240 + this.jump.height;
        const startZ = this.cameraZ + 40;

        // =========================================================================
        // FÍSICA DIRETA REALISTA (SEM MIRA AUTOMÁTICA!):
        // Se calibX == 0, o jogador arremessa RETO para a frente a partir de onde está!
        // Se estiver em playerCourtX = 150 e atirar reto, a bola vai para x = 150
        // (passa 150px à direita da cesta que está em x = 0, errando a tabela!).
        // Para acertar, o jogador PRECISA calibrar com as setas para apontar para x = 0!
        // =========================================================================
        const targetX = this.playerCourtX + (this.calibX * 4.8);

        // Na vertical:
        // Posição base neutra é 220 (abaixo do aro).
        // Seta ↑ (calibY positivo): sobe a trajetória (se for muito alto, passa por cima da tabela!)
        // Seta ↓ (calibY negativo): abaixa a trajetória (se for muito baixo, passa por debaixo da tabela!)
        const baseTargetY = 220;
        const targetY = baseTargetY + (this.calibY * 3.8);

        const vx = (targetX - startX) / flightTime;
        const vy = (targetY - startY + 0.5 * gravity * flightTime * flightTime) / flightTime;

        this.balls.push({
          x: startX,
          y: startY,
          z: startZ,
          vx: vx,
          vy: vy,
          vz: vz,
          radius: 19,
          pointsValue: this.currentDistancePreset,
          rotation: 0,
          rotSpeed: 7,
          scored: false,
          hitBackboard: false,
          active: true,
          fade: 1.0,
          groundBounces: 0
        });

        // Quando a bola resolve (ou após 1.3s), libera para pedir nova bola com Espaço
        setTimeout(() => {
          if (this.playState === 'IN_FLIGHT') {
            this.playState = 'WAITING_NEXT';
            this.updateActionUI('WAITING_NEXT');
          }
        }, 1300);
      }

      updateActionUI(state) {
        if (state === 'HOLDING') {
          this.dom.btnMainAction.classList.remove('next-play');
          this.dom.actionIcon.className = 'bi bi-dribbble';
          this.dom.actionBtnText.textContent = 'Arremessar (Espaço)';
          this.dom.hintActionText.innerHTML = '<i class="bi bi-keyboard"></i><span>Aperte <kbd>ESPAÇO</kbd> para Arremessar</span>';
        } else if (state === 'IN_FLIGHT') {
          this.dom.btnMainAction.classList.add('next-play');
          this.dom.actionIcon.className = 'bi bi-hourglass-split';
          this.dom.actionBtnText.textContent = 'Bola em Voo...';
          this.dom.hintActionText.innerHTML = '<i class="bi bi-eye"></i><span>Acompanhe o arremesso!</span>';
        } else if (state === 'WAITING_NEXT') {
          this.dom.btnMainAction.classList.add('next-play');
          this.dom.actionIcon.className = 'bi bi-arrow-clockwise';
          this.dom.actionBtnText.textContent = 'Nova Jogada (Espaço)';
          this.dom.hintActionText.innerHTML = '<i class="bi bi-keyboard"></i><span>Aperte <kbd>ESPAÇO</kbd> para Nova Jogada</span>';
        }
      }

      updateCalibrationMeters() {
        const pctH = (this.calibX / 60) * 50;
        if (pctH >= 0) {
          this.dom.meterHoriz.style.left = '50%';
          this.dom.meterHoriz.style.width = `${pctH}%`;
        } else {
          this.dom.meterHoriz.style.left = `${50 + pctH}%`;
          this.dom.meterHoriz.style.width = `${Math.abs(pctH)}%`;
        }

        const pctV = (this.calibY / 60) * 50;
        if (pctV >= 0) {
          this.dom.meterVert.style.left = '50%';
          this.dom.meterVert.style.width = `${pctV}%`;
        } else {
          this.dom.meterVert.style.left = `${50 + pctV}%`;
          this.dom.meterVert.style.width = `${Math.abs(pctV)}%`;
        }
      }

      setShootingDistancePreset(pos) {
        if (this.currentDistancePreset === pos) return;
        this.currentDistancePreset = pos;
        this.audio.playJumpShoot();

        [this.dom.btnPos1, this.dom.btnPos2, this.dom.btnPos3].forEach((btn, idx) => {
          btn.classList.toggle('active', idx + 1 === pos);
        });

        if (pos === 1) this.targetCameraZ = 290;
        else if (pos === 2) this.targetCameraZ = 170;
        else if (pos === 3) this.targetCameraZ = 50;

        this.showPopupText(`Distância: ${pos} Ponto${pos > 1 ? 's' : ''}`, '#ffce00');
      }

      /* ==========================================================================
         5. Fases e Cronômetro
         ========================================================================== */
      startLevel(lvlNum) {
        this.level = lvlNum;
        const config = this.levelConfigs.find(c => c.level === lvlNum) || {
          level: lvlNum,
          name: `Nível ${lvlNum}`,
          goal: 10 + (lvlNum - 1) * 10,
          time: 60
        };

        this.levelGoal = config.goal;
        this.timeLeft = config.time;
        this.score = 0;
        this.basketsCount = 0;
        this.isGameOver = false;
        this.balls = [];

        if (this.level === 1) {
          this.dom.btnPeekAim.style.display = 'none';
        } else if (this.level === 2) {
          this.dom.btnPeekAim.style.display = 'inline-flex';
        } else {
          this.dom.btnPeekAim.style.display = 'none';
        }

        this.startNewPlay();
        this.updateHUD();
        this.audio.playWhistle();

        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
          if (this.timeLeft > 0) {
            this.timeLeft--;
            this.updateTimerDisplay();

            if (this.timeLeft === 0) {
              this.endLevel();
            }
          }
        }, 1000);
      }

      updateTimerDisplay() {
        this.dom.valTimer.textContent = this.timeLeft;
        if (this.timeLeft <= 10) {
          this.dom.valTimer.classList.add('hurry');
        } else {
          this.dom.valTimer.classList.remove('hurry');
        }
      }

      endLevel() {
        clearInterval(this.timerInterval);
        this.isGameOver = true;
        this.audio.playWhistle();

        const won = this.score >= this.levelGoal;
        this.currentWin = won;

        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('pedroplay_basketball_highscore', this.highScore);
        }

        if (won) {
          this.audio.playCheer();
          this.confetti.burst();
          this.dom.modalIcon.className = 'modal-icon-wrap win';
          this.dom.modalIconGlyph.className = 'bi bi-trophy-fill';
          this.dom.modalTitle.textContent = `Fase ${this.level} Concluída!`;
          this.dom.modalDesc.textContent = `Sensacional, Pedro! Você marcou ${this.score} pontos e superou a meta de ${this.levelGoal}!`;
          this.dom.modalBtnText.textContent = 'Próxima Fase';
        } else {
          this.dom.modalIcon.className = 'modal-icon-wrap try';
          this.dom.modalIconGlyph.className = 'bi bi-arrow-repeat';
          this.dom.modalTitle.textContent = 'Tempo Esgotado!';
          this.dom.modalDesc.textContent = `Muito bom treino! Você fez ${this.score} pontos. Faltaram apenas ${this.levelGoal - this.score} pontos para a meta. Calibre a mira nas setas e tente de novo!`;
          this.dom.modalBtnText.textContent = 'Tentar Novamente';
        }

        this.dom.modalBaskets.textContent = this.basketsCount;
        this.dom.modalScore.textContent = this.score;
        this.dom.modalHigh.textContent = this.highScore;

        setTimeout(() => {
          this.dom.modal.classList.add('active');
        }, 600);
      }

      restartGame() {
        clearInterval(this.timerInterval);
        this.dom.modal.classList.remove('active');
        this.startLevel(1);
      }

      updateHUD() {
        this.dom.valScore.textContent = this.score;
        this.dom.valHigh.textContent = this.highScore;
        this.dom.valLevel.textContent = this.level;
        this.dom.valGoal.textContent = this.levelGoal;
        this.updateTimerDisplay();
      }

      showPopupText(text, color = '#ffce00') {
        const el = document.createElement('div');
        el.className = 'score-popup';
        el.textContent = text;
        el.style.color = color;
        el.style.left = `${this.centerX}px`;
        el.style.top = `${this.horizonY - 90}px`;

        document.getElementById('arena').appendChild(el);
        setTimeout(() => {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 1300);
      }

      /* ==========================================================================
         6. Projeção 3D & Física
         ========================================================================== */
      project3D(x, y, z) {
        // Câmera acompanha o jogador
        const relX = x - this.cameraX;
        const relZ = z - this.cameraZ;
        const fov = 420;
        const scale = fov / Math.max(1, fov + relZ);

        const screenX = this.centerX + relX * scale;
        const screenY = this.horizonY - (y - 120 + this.jump.height) * scale;

        return { x: screenX, y: screenY, scale: scale, depth: relZ };
      }

      update(dt) {
        this.cameraZ += (this.targetCameraZ - this.cameraZ) * 6 * dt;
        this.cameraX += (this.targetPlayerCourtX - this.cameraX) * 6 * dt;
        this.playerCourtX = this.cameraX;

        // Imagem emergindo de baixo
        if (this.playState === 'EMERGING') {
          this.emergeProgress += dt * 3.2;
          if (this.emergeProgress >= 1) {
            this.emergeProgress = 1;
            this.playState = 'HOLDING';
            this.updateActionUI('HOLDING');
          }
        }

        // Temporizador do Alvo na Fase 2
        if (this.aimTimer > 0) {
          this.aimTimer -= dt;
        }

        if (this.level === 1) {
          this.dom.aimBadge.className = 'aim-status-badge visible';
          this.dom.aimBadge.textContent = 'Mira Fixa (Fase 1)';
        } else if (this.level === 2) {
          if (this.aimTimer > 0) {
            this.dom.aimBadge.className = 'aim-status-badge peeking';
            this.dom.aimBadge.textContent = `Vislumbre: ${Math.ceil(this.aimTimer)}s`;
          } else if (this.isPeeking) {
            this.dom.aimBadge.className = 'aim-status-badge peeking';
            this.dom.aimBadge.textContent = 'Espiando (Shift)';
          } else {
            this.dom.aimBadge.className = 'aim-status-badge hidden';
            this.dom.aimBadge.textContent = 'Memorize!';
          }
        } else {
          this.dom.aimBadge.className = 'aim-status-badge hidden';
          this.dom.aimBadge.textContent = 'Sem Mira (Craque)';
        }

        if (this.jump.active) {
          this.jump.progress += dt * 3.5;
          this.jump.height = Math.sin(this.jump.progress * Math.PI) * 45;

          if (this.jump.progress >= 1) {
            this.jump.active = false;
            this.jump.progress = 0;
            this.jump.height = 0;
          }
        }

        if (this.netWave > 0) {
          this.netWave = Math.max(0, this.netWave - dt * 2.5);
        }

        const gravity = 860;

        // Bolas em voo
        for (let i = this.balls.length - 1; i >= 0; i--) {
          const b = this.balls[i];
          if (!b.active) continue;

          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.z += b.vz * dt;
          b.vy -= gravity * dt;
          b.rotation += b.rotSpeed * dt;

          // 1. Colisão com a Tabela de Vidro
          if (!b.hitBackboard && b.z >= this.hoop.backboardZ - 10 && b.vz > 0) {
            const hw = this.hoop.backboardWidth / 2;
            const hh = this.hoop.backboardHeight / 2;

            if (
              b.x >= this.hoop.x - hw &&
              b.x <= this.hoop.x + hw &&
              b.y >= this.hoop.backboardY - hh &&
              b.y <= this.hoop.backboardY + hh
            ) {
              b.z = this.hoop.backboardZ - 10;
              b.vz = -b.vz * 0.45;
              b.vx = b.vx * 0.75 + (this.hoop.x - b.x) * 0.35;
              b.hitBackboard = true;
              this.audio.playBackboard();
            }
          }

          // 2. Verificação de Cesta ou Aro
          if (!b.scored && b.vy < 0) {
            const distY = Math.abs(b.y - this.hoop.y);
            const distZ = Math.abs(b.z - this.hoop.z);
            const distX = Math.abs(b.x - this.hoop.x);
            const distHoriz = Math.hypot(distX, distZ);

            if (distY < 18 && distHoriz < this.hoop.rimRadius * 0.65) {
              b.scored = true;
              this.score += b.pointsValue;
              this.basketsCount++;
              this.netWave = 1.0;

              this.audio.playSwish();
              this.showPopupText(`+${b.pointsValue} CESTA!`, b.pointsValue === 3 ? '#ffce00' : '#4ade80');
              this.updateHUD();

              b.vx *= 0.25;
              b.vz *= 0.25;
              b.vy *= 0.5;

              if (this.playState === 'IN_FLIGHT') {
                this.playState = 'WAITING_NEXT';
                this.updateActionUI('WAITING_NEXT');
              }
            } else if (distY < 18 && Math.abs(distHoriz - this.hoop.rimRadius) < 16) {
              this.audio.playRim();
              b.vy = -b.vy * 0.45;
              b.vx += (b.x > this.hoop.x ? 1 : -1) * 60;
              b.vz = -b.vz * 0.35;
            }
          }

          // 3. Colisão com o Chão
          if (b.y <= b.radius) {
            b.y = b.radius;
            if (Math.abs(b.vy) > 60) {
              b.vy = -b.vy * 0.6;
              b.vx *= 0.8;
              b.vz *= 0.8;
              b.groundBounces++;
              if (b.groundBounces <= 3) this.audio.playBounce();
            } else {
              b.vy = 0;
              b.vx *= 0.95;
              b.vz *= 0.95;
            }
          }

          if (b.z > 720 || b.y < 0 || (b.groundBounces > 4 && Math.abs(b.vy) < 20)) {
            b.fade -= dt * 1.5;
            if (b.fade <= 0) {
              this.balls.splice(i, 1);
            }
          }
        }
      }

      /* ==========================================================================
         7. Renderização Visual
         ========================================================================== */
      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        this.renderSunnySky();
        this.renderTreesBackground();
        this.renderOutdoorCourtFloor();
        this.renderHoop();
        this.renderBalls();
        this.renderCalibrationReticle();
        this.renderFirstPersonBasketImage();
      }

      renderSunnySky() {
        const skyGrad = this.ctx.createLinearGradient(0, 0, 0, this.horizonY);
        skyGrad.addColorStop(0, '#4a90e2');
        skyGrad.addColorStop(0.5, '#7bb5e6');
        skyGrad.addColorStop(1, '#bfe3f7');
        this.ctx.fillStyle = skyGrad;
        this.ctx.fillRect(0, 0, this.canvas.width, this.horizonY);

        this.ctx.save();
        const sunGrad = this.ctx.createRadialGradient(
          this.canvas.width * 0.22, 60, 10,
          this.canvas.width * 0.22, 60, 260
        );
        sunGrad.addColorStop(0, 'rgba(255, 255, 235, 0.9)');
        sunGrad.addColorStop(0.3, 'rgba(255, 245, 180, 0.45)');
        sunGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        this.ctx.fillStyle = sunGrad;
        this.ctx.fillRect(0, 0, this.canvas.width, this.horizonY);

        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        this.drawCloud(this.canvas.width * 0.65, 70, 70);
        this.drawCloud(this.canvas.width * 0.85, 100, 50);
        this.ctx.restore();
      }

      drawCloud(cx, cy, r) {
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, r, 0, Math.PI * 2);
        this.ctx.arc(cx - r * 0.5, cy + r * 0.2, r * 0.7, 0, Math.PI * 2);
        this.ctx.arc(cx + r * 0.5, cy + r * 0.2, r * 0.7, 0, Math.PI * 2);
        this.ctx.fill();
      }

      renderTreesBackground() {
        this.ctx.save();
        const treeBaseY = this.horizonY;

        this.ctx.fillStyle = '#3a6647';
        for (let x = 0; x <= this.canvas.width + 60; x += 55) {
          const h = 75 + Math.sin(x * 0.03) * 25;
          this.ctx.beginPath();
          this.ctx.arc(x, treeBaseY - h * 0.5, 45, 0, Math.PI * 2);
          this.ctx.fill();
        }

        this.ctx.fillStyle = '#2d5339';
        for (let x = -20; x <= this.canvas.width + 40; x += 75) {
          const h = 90 + Math.cos(x * 0.04) * 30;
          this.ctx.beginPath();
          this.ctx.arc(x, treeBaseY - h * 0.4, 52, 0, Math.PI * 2);
          this.ctx.fill();
        }
        this.ctx.restore();
      }

      renderOutdoorCourtFloor() {
        this.ctx.save();

        const courtGrad = this.ctx.createLinearGradient(0, this.horizonY, 0, this.canvas.height);
        courtGrad.addColorStop(0, '#5a423a');
        courtGrad.addColorStop(0.3, '#785549');
        courtGrad.addColorStop(1, '#4a332d');
        this.ctx.fillStyle = courtGrad;
        this.ctx.fillRect(0, this.horizonY, this.canvas.width, this.canvas.height - this.horizonY);

        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        this.ctx.lineWidth = 2.5;

        // Garrafão (Key Area) em perspectiva
        const kFarL = this.project3D(-130, 0, 560);
        const kFarR = this.project3D(130, 0, 560);
        const kNearL = this.project3D(-130, 0, 290);
        const kNearR = this.project3D(130, 0, 290);

        this.ctx.fillStyle = 'rgba(180, 70, 50, 0.25)';
        this.ctx.beginPath();
        this.ctx.moveTo(kFarL.x, kFarL.y);
        this.ctx.lineTo(kFarR.x, kFarR.y);
        this.ctx.lineTo(kNearR.x, kNearR.y);
        this.ctx.lineTo(kNearL.x, kNearL.y);
        this.ctx.closePath();
        this.ctx.fill();
        this.ctx.stroke();

        // Linha de Lance Livre
        this.ctx.strokeStyle = '#ffce00';
        this.ctx.lineWidth = 3.5;
        this.ctx.beginPath();
        this.ctx.moveTo(kNearL.x, kNearL.y);
        this.ctx.lineTo(kNearR.x, kNearR.y);
        this.ctx.stroke();

        // Arco de Três Pontos
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        this.ctx.lineWidth = 2.5;
        this.ctx.beginPath();
        for (let a = -Math.PI / 2; a <= Math.PI / 2; a += 0.1) {
          const arcR = 380;
          const arcX = Math.sin(a) * arcR;
          const arcZ = 550 - Math.cos(a) * arcR;
          const pt = this.project3D(arcX, 0, arcZ);
          if (a === -Math.PI / 2) this.ctx.moveTo(pt.x, pt.y);
          else this.ctx.lineTo(pt.x, pt.y);
        }
        this.ctx.stroke();

        this.ctx.restore();
      }

      renderHoop() {
        const hp = this.hoop;

        const poleBottom = this.project3D(hp.x, 0, hp.backboardZ + 40);
        const poleTop = this.project3D(hp.x, hp.backboardY, hp.backboardZ + 30);

        this.ctx.save();
        this.ctx.strokeStyle = '#263238';
        this.ctx.lineWidth = 14 * poleBottom.scale;
        this.ctx.beginPath();
        this.ctx.moveTo(poleBottom.x, poleBottom.y);
        this.ctx.lineTo(poleTop.x, poleTop.y);
        this.ctx.stroke();

        const armEnd = this.project3D(hp.x, hp.backboardY - 15, hp.backboardZ);
        this.ctx.lineWidth = 8 * poleBottom.scale;
        this.ctx.strokeStyle = '#37474f';
        this.ctx.beginPath();
        this.ctx.moveTo(poleTop.x, poleTop.y);
        this.ctx.lineTo(armEnd.x, armEnd.y);
        this.ctx.stroke();

        // Tabela de Vidro / Acrílico
        const hw = hp.backboardWidth / 2;
        const hh = hp.backboardHeight / 2;

        const tl = this.project3D(hp.x - hw, hp.backboardY + hh, hp.backboardZ);
        const tr = this.project3D(hp.x + hw, hp.backboardY + hh, hp.backboardZ);
        const br = this.project3D(hp.x + hw, hp.backboardY - hh, hp.backboardZ);
        const bl = this.project3D(hp.x - hw, hp.backboardY - hh, hp.backboardZ);

        const bbGrad = this.ctx.createLinearGradient(tl.x, tl.y, br.x, br.y);
        bbGrad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
        bbGrad.addColorStop(0.4, 'rgba(220, 240, 255, 0.25)');
        bbGrad.addColorStop(1, 'rgba(180, 215, 245, 0.4)');

        this.ctx.fillStyle = bbGrad;
        this.ctx.beginPath();
        this.ctx.moveTo(tl.x, tl.y);
        this.ctx.lineTo(tr.x, tr.y);
        this.ctx.lineTo(br.x, br.y);
        this.ctx.lineTo(bl.x, bl.y);
        this.ctx.closePath();
        this.ctx.fill();

        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 5 * tl.scale;
        this.ctx.stroke();

        // Quadrado Vermelho Guia (Target Box)
        const targetW = 68;
        const targetH = 48;
        const targetY = hp.y + 32;

        const qTL = this.project3D(hp.x - targetW / 2, targetY + targetH / 2, hp.backboardZ);
        const qTR = this.project3D(hp.x + targetW / 2, targetY + targetH / 2, hp.backboardZ);
        const qBR = this.project3D(hp.x + targetW / 2, targetY - targetH / 2, hp.backboardZ);
        const qBL = this.project3D(hp.x - targetW / 2, targetY - targetH / 2, hp.backboardZ);

        this.ctx.strokeStyle = '#e63946';
        this.ctx.lineWidth = 3.5 * qTL.scale;
        this.ctx.strokeRect(qTL.x, qTL.y, qTR.x - qTL.x, qBL.y - qTL.y);

        // Suporte do Aro
        const neckStart = this.project3D(hp.x, hp.y, hp.backboardZ);
        const neckEnd = this.project3D(hp.x, hp.y, hp.z + hp.rimRadius);
        this.ctx.strokeStyle = '#e63946';
        this.ctx.lineWidth = 6 * neckStart.scale;
        this.ctx.beginPath();
        this.ctx.moveTo(neckStart.x, neckStart.y);
        this.ctx.lineTo(neckEnd.x, neckEnd.y);
        this.ctx.stroke();

        // Aro de Metal Vermelho
        const rimCenter = this.project3D(hp.x, hp.y, hp.z);
        const rimRadiusX = hp.rimRadius * rimCenter.scale;
        const rimRadiusY = hp.rimRadius * rimCenter.scale * 0.32;

        this.ctx.strokeStyle = '#e63946';
        this.ctx.lineWidth = 5 * rimCenter.scale;
        this.ctx.beginPath();
        this.ctx.ellipse(rimCenter.x, rimCenter.y, rimRadiusX, rimRadiusY, 0, 0, Math.PI * 2);
        this.ctx.stroke();

        this.renderNet(rimCenter, rimRadiusX, rimRadiusY);

        this.ctx.restore();
      }

      renderNet(rimCenter, rx, ry) {
        const netHeight = 52 * rimCenter.scale;
        const wave = Math.sin(performance.now() * 0.02) * 8 * this.netWave;

        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        this.ctx.lineWidth = 1.6 * rimCenter.scale;

        const strings = 12;
        const topPts = [];
        const botPts = [];

        for (let i = 0; i < strings; i++) {
          const angle = (i / strings) * Math.PI * 2;
          const tx = rimCenter.x + Math.cos(angle) * rx;
          const ty = rimCenter.y + Math.sin(angle) * ry;

          const bx = rimCenter.x + Math.cos(angle) * (rx * 0.5) + wave;
          const by = rimCenter.y + netHeight + Math.sin(angle) * (ry * 0.4);

          topPts.push({ x: tx, y: ty });
          botPts.push({ x: bx, y: by });

          this.ctx.beginPath();
          this.ctx.moveTo(tx, ty);
          this.ctx.quadraticCurveTo(
            (tx + bx) / 2 + wave * 0.5,
            (ty + by) / 2,
            bx,
            by
          );
          this.ctx.stroke();
        }

        for (let r = 0.3; r <= 0.85; r += 0.3) {
          this.ctx.beginPath();
          for (let i = 0; i <= strings; i++) {
            const idx = i % strings;
            const px = topPts[idx].x * (1 - r) + botPts[idx].x * r;
            const py = topPts[idx].y * (1 - r) + botPts[idx].y * r;
            if (i === 0) this.ctx.moveTo(px, py);
            else this.ctx.lineTo(px, py);
          }
          this.ctx.stroke();
        }

        this.ctx.restore();
      }

      renderBalls() {
        for (let b of this.balls) {
          const pt = this.project3D(b.x, b.y, b.z);
          const r = b.radius * pt.scale;

          if (r < 2) continue;

          this.ctx.save();
          this.ctx.globalAlpha = Math.max(0, Math.min(1, b.fade));

          const shadowPt = this.project3D(b.x, 0, b.z);
          const shadowR = r * 0.9;
          this.ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          this.ctx.beginPath();
          this.ctx.ellipse(shadowPt.x, shadowPt.y, shadowR, shadowR * 0.35, 0, 0, Math.PI * 2);
          this.ctx.fill();

          this.drawRotatingBasketball(pt.x, pt.y, r, b.rotation);

          this.ctx.restore();
        }
      }

      drawRotatingBasketball(cx, cy, radius, rot = 0) {
        this.ctx.save();
        this.ctx.translate(cx, cy);
        this.ctx.rotate(rot);

        const ballGrad = this.ctx.createRadialGradient(
          -radius * 0.3,
          -radius * 0.35,
          radius * 0.1,
          0,
          0,
          radius
        );
        ballGrad.addColorStop(0, '#ff8a43');
        ballGrad.addColorStop(0.65, '#f26419');
        ballGrad.addColorStop(1, '#9e3404');

        this.ctx.fillStyle = ballGrad;
        this.ctx.beginPath();
        this.ctx.arc(0, 0, radius, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.strokeStyle = '#22130b';
        this.ctx.lineWidth = Math.max(1, radius * 0.08);

        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.moveTo(-radius, 0);
        this.ctx.lineTo(radius, 0);
        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.moveTo(0, -radius);
        this.ctx.lineTo(0, radius);
        this.ctx.stroke();

        const arcOffset = radius * 0.55;
        this.ctx.beginPath();
        this.ctx.arc(-arcOffset, 0, radius * 0.8, -Math.PI / 3, Math.PI / 3);
        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.arc(arcOffset, 0, radius * 0.8, (2 * Math.PI) / 3, (4 * Math.PI) / 3);
        this.ctx.stroke();

        this.ctx.restore();
      }

      /* ==========================================================================
         8. Retículo de Calibragem por Fase
         ========================================================================== */
      renderCalibrationReticle() {
        if (this.isGameOver) return;

        let shouldShowTarget = false;
        let targetAlpha = 1.0;

        if (this.level === 1) {
          shouldShowTarget = true;
        } else if (this.level === 2) {
          if (this.aimTimer > 0) {
            shouldShowTarget = true;
            targetAlpha = Math.min(1.0, this.aimTimer / 0.8);
          } else if (this.isPeeking) {
            shouldShowTarget = true;
            targetAlpha = 0.9;
          }
        }

        if (!shouldShowTarget) return;

        this.ctx.save();
        this.ctx.globalAlpha = targetAlpha;

        // =======================================================================
        // O Alvo mostra exatamente para onde a bola irá voar com a calibragem atual!
        // targetX = playerCourtX + (calibX * 4.8)
        // targetY = 220 + (calibY * 3.8)
        // Se calibX == 0 e playerCourtX != 0, o alvo fica deslocado do centro da cesta,
        // mostrando ao jogador que ele PRECISA calibrar nas setas!
        // =======================================================================
        const aimTargetX = this.playerCourtX + (this.calibX * 4.8);
        const aimTargetY = 220 + (this.calibY * 3.8);

        const targetPt = this.project3D(aimTargetX, aimTargetY, this.hoop.z);

        this.ctx.strokeStyle = '#ffce00';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        this.ctx.arc(targetPt.x, targetPt.y, 14, 0, Math.PI * 2);
        this.ctx.stroke();

        this.ctx.strokeStyle = '#dd0000';
        this.ctx.beginPath();
        this.ctx.moveTo(targetPt.x - 20, targetPt.y);
        this.ctx.lineTo(targetPt.x - 6, targetPt.y);
        this.ctx.moveTo(targetPt.x + 6, targetPt.y);
        this.ctx.lineTo(targetPt.x + 20, targetPt.y);
        this.ctx.moveTo(targetPt.x, targetPt.y - 20);
        this.ctx.lineTo(targetPt.x, targetPt.y - 6);
        this.ctx.moveTo(targetPt.x, targetPt.y + 6);
        this.ctx.lineTo(targetPt.x, targetPt.y + 20);
        this.ctx.stroke();

        this.ctx.restore();
      }

      /* ==========================================================================
         9. Imagem Real dos Braços e Bola (img/basket.png)
         - Desaparece imediatamente ao arremessar (playState === 'IN_FLIGHT' ou 'WAITING_NEXT')
         - Emerge de baixo na nova jogada (playState === 'EMERGING')
         ========================================================================== */
      renderFirstPersonBasketImage() {
        // Se a bola já foi arremessada, a imagem desaparece!
        if (this.playState === 'IN_FLIGHT' || this.playState === 'WAITING_NEXT') {
          return;
        }

        if (!this.basketImg.complete || !this.basketImg.naturalWidth) {
          return;
        }

        this.ctx.save();

        const imgNaturalW = this.basketImg.naturalWidth;
        const imgNaturalH = this.basketImg.naturalHeight;
        const aspect = imgNaturalW / imgNaturalH;

        // Proporção imersiva na tela
        const drawH = Math.min(this.canvas.height * 0.88, 700);
        const drawW = drawH * aspect;

        // Inclinação suave com as setas de calibragem
        const shiftX = this.calibX * 1.8;
        const shiftY = -this.calibY * 1.4;
        const idleBob = Math.sin(performance.now() * 0.003) * 3;

        // Posição final ancorada na base da tela
        const targetX = this.centerX - drawW / 2 + shiftX;
        const targetY = this.canvas.height - drawH + 30 + shiftY + idleBob;

        let currentY = targetY;

        // Animação de emergir de baixo na nova jogada
        if (this.playState === 'EMERGING') {
          const offscreenY = this.canvas.height + 60;
          currentY = offscreenY + (targetY - offscreenY) * this.emergeProgress;
        }

        this.ctx.drawImage(this.basketImg, targetX, currentY, drawW, drawH);

        this.ctx.restore();
      }

      /* ==========================================================================
         10. Loop de Animação a 60fps
         ========================================================================== */
      gameLoop(now) {
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;

        this.update(dt);
        this.render();

        requestAnimationFrame((t) => this.gameLoop(t));
      }
    }

    // Inicialização ao carregar
    window.addEventListener('DOMContentLoaded', () => {
      window.gameInstance = new BasketballGame();

      try {
        const count = parseInt(localStorage.getItem('pedroplay_visits_basquete') || '0', 10) + 1;
        localStorage.setItem('pedroplay_visits_basquete', count);
      } catch (e) {}
    });
  </script>
</body>
