<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Basquete Kids — Alemãozinho Pedro</title>
  <!-- Bootstrap Icons via CDN oficial -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <style>
    :root {
      /* Paleta GitHub Dark Mode */
      --gh-bg-canvas: #0d1117;
      --gh-bg-subtle: #161b22;
      --gh-bg-elevated: #1c2128;
      --gh-bg-overlay: #21262d;
      --gh-border-default: #30363d;
      --gh-border-muted: #21262d;
      --gh-text-primary: #e6edf3;
      --gh-text-secondary: #8b949e;
      --gh-text-muted: #6e7681;

      /* Cores da Alemanha */
      --de-black: #000000;
      --de-red: #dd0000;
      --de-gold: #ffce00;

      /* Cores do Basquete & Placar */
      --bball-orange: #f26419;
      --bball-rim: #e63946;
      --led-gold: #ffce00;
      --led-blue: #38bdf8;
      --led-green: #4ade80;
      --led-red: #ff3344;

      --font-brand: 'Georgia', 'Times New Roman', Times, serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--gh-bg-canvas);
      color: var(--gh-text-primary);
      font-family: var(--font-ui);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none; /* Desativa zoom/scroll nativo para toque no jogo */
    }

    /* ==========================================================================
       1. Top Bar Minimalista Mobile-First (Sem Cortes em Nenhuma Resolução)
       ========================================================================== */
    .mobile-header-bar {
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(48, 54, 61, 0.7);
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      z-index: 40;
      flex-shrink: 0;
      height: 44px;
    }

    .header-brand-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .brand-logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }

    .brand-name-text {
      font-family: var(--font-brand);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gh-text-primary);
      white-space: nowrap;
    }

    .brand-name-text span {
      color: var(--de-gold);
    }

    /* Mini-Placar Integrado no Topo */
    .mini-scoreboard {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 1;
      overflow: hidden;
    }

    .mini-chip {
      background-color: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--gh-border-default);
      border-radius: 6px;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--gh-text-secondary);
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .mini-chip strong {
      color: var(--led-gold);
      font-size: 0.88rem;
    }

    .mini-chip.timer strong {
      color: var(--led-blue);
    }

    .mini-chip.timer.hurry strong {
      color: var(--led-red);
      animation: pulseAlert 0.5s infinite alternate;
    }

    @keyframes pulseAlert {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    /* Botão Sanduíche (☰) */
    .btn-hamburger {
      background-color: var(--gh-bg-overlay);
      border: 1px solid var(--gh-border-default);
      color: var(--gh-text-primary);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-hamburger:hover,
    .btn-hamburger:active {
      border-color: var(--de-gold);
      color: var(--de-gold);
      background-color: var(--gh-bg-elevated);
    }

    /* Em telas muito estreitas (<420px), esconde o texto da marca mantendo a logo e o placar */
    @media (max-width: 420px) {
      .brand-name-text {
        display: none;
      }
    }

    /* ==========================================================================
       2. Menu Gaveta Sanduíche (Drawer Lateral)
       ========================================================================== */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(1, 4, 9, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 290px;
      max-width: 85vw;
      background-color: var(--gh-bg-subtle);
      border-left: 1px solid var(--gh-border-default);
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 18px;
      gap: 16px;
    }

    .drawer-backdrop.active .drawer-content {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gh-border-default);
    }

    .drawer-title {
      font-family: var(--font-brand);
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gh-text-primary);
    }

    .btn-close-drawer {
      background: transparent;
      border: none;
      color: var(--gh-text-secondary);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .btn-close-drawer:hover {
      color: var(--de-gold);
    }

    .drawer-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--de-red);
    }

    .drawer-stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .drawer-stat-box {
      background: var(--gh-bg-canvas);
      border: 1px solid var(--gh-border-default);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }

    .drawer-stat-label {
      font-size: 0.65rem;
      color: var(--gh-text-muted);
      text-transform: uppercase;
    }

    .drawer-stat-val {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--gh-text-primary);
    }

    .drawer-teleport-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .drawer-btn {
      background: var(--gh-bg-overlay);
      border: 1px solid var(--gh-border-default);
      color: var(--gh-text-primary);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .drawer-btn:hover {
      border-color: var(--de-gold);
      color: var(--de-gold);
      background: var(--gh-bg-elevated);
    }

    .drawer-btn.active {
      background: linear-gradient(135deg, #dd0000 0%, #b30000 100%);
      border-color: var(--de-gold);
      color: #ffffff;
    }

    .drawer-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--gh-border-default);
    }

    /* ==========================================================================
       3. Arena Principal & Canvas
       ========================================================================== */
    .arena-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #7bb5e6;
      touch-action: none !important;
      user-select: none;
      -webkit-user-select: none;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none !important;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Calibrador Sutil no Canto Superior Esquerdo (Oculto no Mobile) */
    .compact-calib-bars {
      position: absolute;
      top: 10px;
      left: 12px;
      pointer-events: none;
      background: rgba(13, 17, 23, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(48, 54, 61, 0.5);
      border-radius: 6px;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.65rem;
      color: var(--gh-text-secondary);
      z-index: 20;
    }

    @media (max-width: 768px) {
      .compact-calib-bars {
        display: none !important;
      }
    }

    .calib-mini-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .calib-mini-meter {
      width: 50px;
      height: 4px;
      background: #21262d;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .calib-mini-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, #dd0000, #ffce00, #4ade80);
    }

    .calib-mini-center {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: #ffffff;
      transform: translateX(-50%);
    }

    /* ==========================================================================
       4. Controles Mobile-First: Arraste para Mirar + Botão Centralizado
       ========================================================================== */
    .mobile-bottom-hud {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      pointer-events: none;
      z-index: 30;
    }

    /* Dica Sutil Flutuante de Toque (Some ao arrastar) */
    .touch-hint-pill {
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(48, 54, 61, 0.6);
      color: var(--gh-text-secondary);
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .touch-hint-pill i {
      color: var(--de-gold);
    }

    /* D-Pad Visível APENAS em Telas Grandes/Desktop para quem prefere clique */
    .compact-dpad {
      display: none;
      pointer-events: auto;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(2, 40px);
      gap: 4px;
      background: rgba(13, 17, 23, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(48, 54, 61, 0.6);
      padding: 6px;
      border-radius: 10px;
    }

    @media (min-width: 769px) {
      .compact-dpad {
        display: grid;
        position: absolute;
        bottom: 14px;
        left: 14px;
      }
    }

    .dpad-btn {
      background-color: rgba(33, 38, 45, 0.9);
      border: 1px solid var(--gh-border-default);
      color: var(--gh-text-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .dpad-btn:active,
    .dpad-btn.pressed {
      background-color: var(--de-red);
      color: #ffffff;
      border-color: var(--de-gold);
      transform: scale(0.92);
    }

    /* Botão Centralizado na Base (Apenas quando precisa recarregar ou no Desktop) */
    .btn-action-container {
      display: flex;
      justify-content: center;
      width: 100%;
      pointer-events: none;
    }

    .btn-main-shoot {
      pointer-events: auto;
      border-radius: 50px;
      padding: 12px 28px;
      font-family: var(--font-brand);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }

    .btn-main-shoot.shoot-mode {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      border: 2px solid #ffce00;
      box-shadow: 0 4px 18px rgba(249, 115, 22, 0.5);
    }

    .btn-main-shoot.reload-mode {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: 2px solid #38bdf8;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.5);
    }

    .btn-main-shoot:hover,
    .btn-main-shoot:active {
      transform: scale(1.04);
      filter: brightness(1.1);
    }

    /* Popups Flutuantes */
    .score-popup {
      position: absolute;
      font-family: var(--font-brand);
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      pointer-events: none;
      animation: floatScore 1.3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      z-index: 50;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
    }

    @keyframes floatScore {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px) scale(0.6);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -20px) scale(1.15);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -60px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -90px) scale(0.85);
      }
    }

    /* Modal de Resultado */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background-color: rgba(13, 17, 23, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--gh-bg-subtle);
      border: 2px solid var(--gh-border-default);
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1);
    }

    .modal-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border: 2px solid var(--gh-border-default);
    }

    .modal-icon-wrap.win {
      background: radial-gradient(circle, rgba(255, 206, 0, 0.2) 0%, rgba(221, 0, 0, 0.1) 100%);
      border-color: var(--de-gold);
      color: var(--de-gold);
    }

    .modal-icon-wrap.try {
      background-color: var(--gh-bg-overlay);
      border-color: var(--de-red);
      color: var(--de-red);
    }

    .modal-title {
      font-family: var(--font-brand);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gh-text-primary);
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 0.9rem;
      color: var(--gh-text-secondary);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .modal-stats {
      background-color: var(--gh-bg-canvas);
      border: 1px solid var(--gh-border-default);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }

    .stat-cell-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gh-text-muted);
      margin-bottom: 2px;
    }

    .stat-cell-val {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gh-text-primary);
    }

    .btn-modal {
      width: 100%;
      background: linear-gradient(135deg, #dd0000 0%, #b30000 100%);
      color: #ffffff;
      border: 1px solid var(--de-gold);
      border-radius: 8px;
      padding: 12px 18px;
      font-family: var(--font-brand);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(221, 0, 0, 0.4);
    }

    .btn-modal:hover {
      background: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 206, 0, 0.5);
    }

    #confettiCanvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 130;
    }
  </style>
</head>
<body>

  <!-- Top Bar Minimalista Mobile-First com Logo Oficial e Mini Placar Compacto -->
  <header class="mobile-header-bar">
    <div class="header-brand-wrap">
      <img
        src="img/logo.png"
        onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/patricschurhaus/pedroplay/main/img/logo.png';"
        alt="Logo Alemãozinho Pedro"
        class="brand-logo-img"
      />
      <span class="brand-name-text">Basquete<span>Kids</span></span>
    </div>

    <!-- Mini Placar Ultra Compacto -->
    <div class="mini-scoreboard">
      <div class="mini-chip" title="Fase atual">
        <i class="bi bi-flag"></i>
        <span>Fase</span>
        <strong id="valLevel">1</strong>
      </div>

      <div class="mini-chip" title="Pontos na rodada">
        <i class="bi bi-star-fill" style="color: var(--led-gold);"></i>
        <strong id="valScore">0</strong>
      </div>

      <div class="mini-chip timer" title="Tempo restante" id="chipTimer">
        <i class="bi bi-clock"></i>
        <strong id="valTimer">60</strong>
      </div>
    </div>

    <!-- Botão Sanduíche (☰) -->
    <button class="btn-hamburger" id="btnToggleDrawer" aria-label="Abrir menu sanduíche">
      <i class="bi bi-list"></i>
    </button>
  </header>

  <!-- Arena 3D -->
  <main class="arena-container" id="arena">
    <canvas id="gameCanvas"></canvas>

    <!-- Indicador de Calibragem Sutil no Canto Superior Esquerdo -->
    <div class="compact-calib-bars" id="calibIndicator">
      <div class="calib-mini-row">
        <span>H</span>
        <div class="calib-mini-meter">
          <div class="calib-mini-center"></div>
          <div class="calib-mini-fill" id="meterHoriz" style="left: 50%; width: 0%;"></div>
        </div>
      </div>
      <div class="calib-mini-row">
        <span>V</span>
        <div class="calib-mini-meter">
          <div class="calib-mini-center"></div>
          <div class="calib-mini-fill" id="meterVert" style="left: 50%; width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Controles na Base da Tela (100% Mobile-First) -->
    <div class="mobile-bottom-hud">
      <!-- Dica de Toque Flutuante -->
      <div class="touch-hint-pill" id="touchHintPill">
        <i class="bi bi-hand-index-thumb"></i>
        <span id="touchHintText">Arraste para mirar &bull; Toque em Arremessar</span>
      </div>

      <!-- D-Pad Visível APENAS em Desktop -->
      <div class="compact-dpad" aria-label="Controle de setas">
        <div></div>
        <button class="dpad-btn" id="dpadUp" title="Calibrar para cima"><i class="bi bi-arrow-up"></i></button>
        <div></div>
        <button class="dpad-btn" id="dpadLeft" title="Calibrar para esquerda"><i class="bi bi-arrow-left"></i></button>
        <button class="dpad-btn" id="dpadDown" title="Calibrar para baixo"><i class="bi bi-arrow-down"></i></button>
        <button class="dpad-btn" id="dpadRight" title="Calibrar para direita"><i class="bi bi-arrow-right"></i></button>
      </div>

      <!-- Botão Ergonômico de Arremesso / Nova Jogada -->
      <div class="btn-action-container">
        <button class="btn-main-shoot shoot-mode" id="btnMainShoot" aria-label="Ação do jogo">
          <i class="bi bi-dribbble" id="actionIcon"></i>
          <span id="actionBtnText">Arremessar</span>
        </button>
      </div>
    </div>

    <!-- Confetes -->
    <canvas id="confettiCanvas"></canvas>

  <script>
    /**
     * PedroPlay — Basquete Kids (Touch Nativo: Arraste para Mirar & Solte para Disparar)
     * - Topo compacto com Logo Oficial Alemãozinho Pedro (sem cortes em mobile).
     * - Mobile: Tocar e arrastar o dedo move a mira em tempo real (arrasta para a esquerda -> tabela vai para a direita).
     * - Mobile: Soltou o dedo da tela -> Dispara o arremesso!
     * - O botão surge apenas para recarregar nova bola ("Nova Jogada"), 100% centralizado e sem vazamento.
     */

    /* ==========================================================================
       1. Motor de Efeitos Sonoros Acústicos (Web Audio API)
       ========================================================================== */
    class BasketballAudio {
      constructor() {
        this.ctx = null;
        this.muted = localStorage.getItem('basketball_sound_muted') === 'true';
        this.updateIcon();
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem('basketball_sound_muted', this.muted);
        this.updateIcon();
        if (!this.muted) this.playSwish();
      }

      updateIcon() {
        const icon = document.getElementById('soundIcon');
        const label = document.getElementById('soundLabel');
        if (icon) {
          icon.className = this.muted ? 'bi bi-volume-mute' : 'bi bi-volume-up';
        }
        if (label) {
          label.textContent = this.muted ? 'Som: Mudo' : 'Som: Ativo';
        }
      }

      playSwish() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const bufferSize = this.ctx.sampleRate * 0.35;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.08));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2200, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.3);
        filter.Q.value = 3.2;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.75, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playRim() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(360, this.ctx.currentTime + 0.22);

        gain.gain.setValueAtTime(0.55, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.24);
      }

      playBackboard() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(65, this.ctx.currentTime + 0.14);

        gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }

      playBounce() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.09);

        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.005, this.ctx.currentTime + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }

      playJumpShoot() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.16);

        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }

      playEmerge() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(340, this.ctx.currentTime + 0.2);

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.24);
      }

      playTick() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.035, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.035);
      }

      playWhistle() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(2700, this.ctx.currentTime);
        osc2.frequency.setValueAtTime(2760, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.38);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start();
        osc2.start();
        osc1.stop(this.ctx.currentTime + 0.4);
        osc2.stop(this.ctx.currentTime + 0.4);
      }

      playCheer() {
        if (this.muted) return;
        this.initCtx();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          const start = this.ctx.currentTime + idx * 0.1;
          gain.gain.setValueAtTime(0.25, start);
          gain.gain.exponentialRampToValueAtTime(0.01, start + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.38);
        });
      }
    }

    /* ==========================================================================
       2. Confetes de Vitória
       ========================================================================== */
    class ConfettiEffect {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.animId = null;
        this.colors = ['#ffce00', '#dd0000', '#ffffff', '#00ff66', '#38bdf8', '#f26419'];
        this.resize();
        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      burst() {
        this.resize();
        this.particles = [];
        for (let i = 0; i < 90; i++) {
          this.particles.push({
            x: this.canvas.width * (0.3 + Math.random() * 0.4),
            y: this.canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 16,
            vy: -Math.random() * 14 - 4,
            size: Math.random() * 8 + 4,
            color: this.colors[Math.floor(Math.random() * this.colors.length)],
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 12,
            opacity: 1
          });
        }
        if (!this.animId) this.loop();
      }

      loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        let active = 0;

        for (let p of this.particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.4;
          p.rotation += p.vRot;
          p.opacity -= 0.008;

          if (p.opacity > 0 && p.y < this.canvas.height) {
            active++;
            this.ctx.save();
            this.ctx.translate(p.x, p.y);
            this.ctx.rotate((p.rotation * Math.PI) / 180);
            this.ctx.globalAlpha = Math.max(0, p.opacity);
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
            this.ctx.restore();
          }
        }

        if (active > 0) {
          this.animId = requestAnimationFrame(() => this.loop());
        } else {
          this.animId = null;
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }
      }
    }

    /* ==========================================================================
       3. Motor Principal do Basquete Kids
       ========================================================================== */
    class BasketballGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new BasketballAudio();
        this.confetti = new ConfettiEffect('confettiCanvas');

        // Carrega imagem dos braços e da bola
        this.basketImg = new Image();
        this.basketImg.src = 'img/basket.png';
        this.basketImg.onerror = () => {
          this.basketImg.src = 'https://raw.githubusercontent.com/patricschurhaus/pedroplay/main/img/basket.png';
        };

        this.isDesktop = window.matchMedia('(min-width: 769px)').matches;

        // Estado do Jogo
        this.score = 0;
        this.highScore = parseInt(localStorage.getItem('pedroplay_basketball_highscore') || '0', 10);
        this.basketsCount = 0;
        this.level = 1;
        this.timeLeft = 60;
        this.timerInterval = null;
        this.isGameOver = false;

        this.levelConfigs = [
          { level: 1, name: 'Iniciante na Quadra', goal: 6, time: 60 },
          { level: 2, name: 'Armador Talentoso', goal: 14, time: 60 },
          { level: 3, name: 'Estrela da Cesta', goal: 22, time: 60 },
          { level: 4, name: 'Lenda da NBA', goal: 32, time: 60 }
        ];

        // Posição de Distância (1, 2 ou 3)
        this.currentDistancePreset = 1;
        this.targetCameraZ = 290;
        this.cameraZ = 290;

        // Posição Dinâmica do Jogador na Quadra
        this.playerCourtX = 0;
        this.targetPlayerCourtX = 0;
        this.cameraX = 0;

        // Estados do Ciclo: 'HOLDING', 'EMERGING', 'IN_FLIGHT', 'WAITING_NEXT'
        this.playState = 'HOLDING';
        this.emergeProgress = 1.0;

        // Pulo no Ar (Jump Shot)
        this.jump = {
          active: false,
          progress: 0,
          height: 0
        };

        // Calibragem nas Setas / Toque
        this.calibX = 0;
        this.calibY = 0;

        // Controle por Toque / Arraste (Mobile)
        this.touchState = {
          active: false,
          startX: 0,
          startY: 0,
          startCalibX: 0,
          startCalibY: 0,
          startTime: 0,
          moved: false
        };

        // Alvo de Mira por Fase
        this.aimTimer = 2.0;

        // Bolas de Basquete no Ar
        this.balls = [];

        // Geometria da Cesta fixa na Quadra (x = 0)
        this.hoop = {
          x: 0,
          y: 290,
          z: 550,
          rimRadius: 32,
          backboardWidth: 220,
          backboardHeight: 150,
          backboardY: 340,
          backboardZ: 575
        };

        this.netWave = 0;

        // Elementos DOM
        this.dom = {
          valScore: document.getElementById('valScore'),
          valLevel: document.getElementById('valLevel'),
          valTimer: document.getElementById('valTimer'),
          chipTimer: document.getElementById('chipTimer'),
          meterHoriz: document.getElementById('meterHoriz'),
          meterVert: document.getElementById('meterVert'),
          btnMainShoot: document.getElementById('btnMainShoot'),
          actionIcon: document.getElementById('actionIcon'),
          actionBtnText: document.getElementById('actionBtnText'),
          touchHintPill: document.getElementById('touchHintPill'),
          touchHintText: document.getElementById('touchHintText'),
          drawerBackdrop: document.getElementById('drawerBackdrop'),
          btnToggleDrawer: document.getElementById('btnToggleDrawer'),
          btnCloseDrawer: document.getElementById('btnCloseDrawer'),
          drawerGoal: document.getElementById('drawerGoal'),
          drawerHigh: document.getElementById('drawerHigh'),
          btnPos1: document.getElementById('btnPos1'),
          btnPos2: document.getElementById('btnPos2'),
          btnPos3: document.getElementById('btnPos3'),
          modal: document.getElementById('resultModal'),
          modalTitle: document.getElementById('modalTitle'),
          modalDesc: document.getElementById('modalDesc'),
          modalBaskets: document.getElementById('modalBaskets'),
          modalScore: document.getElementById('modalScore'),
          modalHigh: document.getElementById('modalHigh'),
          modalIcon: document.getElementById('modalIcon'),
          modalIconGlyph: document.getElementById('modalIconGlyph'),
          btnModalAction: document.getElementById('btnModalAction'),
          modalBtnText: document.getElementById('modalBtnText')
        };

        this.init();
      }

      init() {
        this.resize();
        window.addEventListener('resize', () => {
          this.isDesktop = window.matchMedia('(min-width: 769px)').matches;
          this.resize();
          this.updateActionUI(this.playState);
        });

        this.setupControls();
        this.setupTouchControls();
        this.setupDrawer();
        this.updateHUD();
        this.updateCalibrationMeters();
        this.startLevel(1);

        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.gameLoop(t));
      }

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;
        this.centerX = this.canvas.width / 2;
        this.horizonY = this.canvas.height * 0.44;
      }

      setupDrawer() {
        const openDrawer = () => this.dom.drawerBackdrop.classList.add('active');
        const closeDrawer = () => this.dom.drawerBackdrop.classList.remove('active');

        this.dom.btnToggleDrawer.addEventListener('click', openDrawer);
        this.dom.btnCloseDrawer.addEventListener('click', closeDrawer);
        this.dom.drawerBackdrop.addEventListener('click', (e) => {
          if (e.target === this.dom.drawerBackdrop) closeDrawer();
        });

        document.getElementById('btnSoundToggle').addEventListener('click', () => {
          this.audio.toggleMute();
        });

        document.getElementById('btnRestartGame').addEventListener('click', () => {
          closeDrawer();
          this.restartGame();
        });
      }

      /* ==========================================================================
         4. Controles Mobile por Toque Nativo (DIREÇÃO NATURAL 1:1):
         - Arrastar dedo para a direita -> tabela vai para a DIREITA
         - Arrastar dedo para a esquerda -> tabela vai para a ESQUERDA
         - Arrastar dedo para cima -> tabela vai para CIMA
         - Arrastar dedo para baixo -> tabela vai para BAIXO
         - Sensibilidade ampliada: um leve toque já move e encaixa a mira!
         - Blindado contra gestos de borda do Android (passive: false + preventDefault)
         ========================================================================== */
      setupTouchControls() {
        const arena = document.getElementById('arena');

        arena.addEventListener('touchstart', (e) => {
          if (this.isGameOver || this.dom.drawerBackdrop.classList.contains('active')) return;

          // Se estiver esperando nova jogada, um toque recarrega a bola!
          if (this.playState === 'WAITING_NEXT') {
            this.startNewPlay();
            return;
          }

          if (this.playState !== 'HOLDING') return;

          const touch = e.touches[0];
          this.touchState.active = true;
          this.touchState.startX = touch.clientX;
          this.touchState.startY = touch.clientY;
          // Guarda a calibragem atual como ponto de partida (arraste cumulativo!)
          this.touchState.startCalibX = this.calibX;
          this.touchState.startCalibY = this.calibY;
          this.touchState.startTime = performance.now();
          this.touchState.moved = false;

          // Esconde sutilmente a pílula de dica ao começar o toque
          this.dom.touchHintPill.style.opacity = '0.35';
        }, { passive: true });

        arena.addEventListener('touchmove', (e) => {
          if (!this.touchState.active || this.playState !== 'HOLDING') return;

          // Impede o Android de disparar gesto de "Voltar" ou scroll nativo ao puxar na borda
          if (e.cancelable) {
            e.preventDefault();
          }

          const touch = e.touches[0];
          const deltaX = touch.clientX - this.touchState.startX;
          const deltaY = touch.clientY - this.touchState.startY;

          if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
            this.touchState.moved = true;
          }

          // Sensibilidade do arraste natural, ágil e direta:
          // DIREÇÃO NATURAL:
          // Arrastar para a direita (deltaX > 0) -> aumenta calibX -> tabela se move para a DIREITA!
          // Arrastar para a esquerda (deltaX < 0) -> diminui calibX -> tabela se move para a ESQUERDA!
          // Arrastar para cima (deltaY < 0) -> diminui calibY -> tabela se move para CIMA!
          // Arrastar para baixo (deltaY > 0) -> aumenta calibY -> tabela se move para BAIXO!
          const sensitivityX = 1.35;
          const sensitivityY = 1.25;

          this.calibX = Math.max(-250, Math.min(250, this.touchState.startCalibX + deltaX * sensitivityX));
          this.calibY = Math.max(-120, Math.min(120, this.touchState.startCalibY + deltaY * sensitivityY));

          this.updateCalibrationMeters();
        }, { passive: false });

        const endTouch = () => {
          if (!this.touchState.active) return;
          this.touchState.active = false;
          this.dom.touchHintPill.style.opacity = '1';
          // Arraste livre cumulativo: não dispara ao soltar o dedo!
        };

        arena.addEventListener('touchend', endTouch, { passive: true });
        arena.addEventListener('touchcancel', endTouch, { passive: true });
      }

      setupControls() {
        // Teclado (Desktop - Direção Natural)
        window.addEventListener('keydown', (e) => {
          let adjusted = false;

          if (this.playState === 'HOLDING') {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
              this.calibX = Math.max(-250, this.calibX - 5);
              adjusted = true;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
              this.calibX = Math.min(250, this.calibX + 5);
              adjusted = true;
            } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
              this.calibY = Math.max(-120, this.calibY - 4.5);
              adjusted = true;
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
              this.calibY = Math.min(120, this.calibY + 4.5);
              adjusted = true;
            }
          }

          if (e.code === 'Space') {
            e.preventDefault();
            this.handleSpaceAction();
          } else if (e.key === '1') {
            this.setShootingDistancePreset(1);
          } else if (e.key === '2') {
            this.setShootingDistancePreset(2);
          } else if (e.key === '3') {
            this.setShootingDistancePreset(3);
          } else if (e.key === 'r' || e.key === 'R') {
            this.restartGame();
          }

          if (adjusted) {
            this.audio.playTick();
            this.updateCalibrationMeters();
          }
        });

        // D-Pad Desktop (Direção Natural)
        const bindDpad = (id, dx, dy) => {
          const btn = document.getElementById(id);
          if (btn) {
            btn.addEventListener('click', () => {
              if (this.playState !== 'HOLDING') return;
              if (dx !== 0) this.calibX = Math.max(-250, Math.min(250, this.calibX + dx));
              if (dy !== 0) this.calibY = Math.max(-120, Math.min(120, this.calibY + dy));
              this.audio.playTick();
              this.updateCalibrationMeters();
            });
          }
        };

        bindDpad('dpadLeft', -5, 0);
        bindDpad('dpadRight', 5, 0);
        bindDpad('dpadUp', 0, -4.5);
        bindDpad('dpadDown', 0, 4.5);

        // Botão Ergonômico de Arremesso / Nova Jogada
        const onActionBtn = (e) => {
          e.preventDefault();
          e.stopPropagation();
          this.handleSpaceAction();
        };

        this.dom.btnMainShoot.addEventListener('click', onActionBtn);
        this.dom.btnMainShoot.addEventListener('touchend', onActionBtn);
        this.dom.btnMainShoot.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });

        // Clique com Mouse no Desktop
        this.canvas.addEventListener('mousedown', (e) => {
          if (this.isDesktop && e.button === 0 && !this.isGameOver && !this.dom.drawerBackdrop.classList.contains('active')) {
            this.handleSpaceAction();
          }
        });

        this.dom.btnPos1.addEventListener('click', () => this.setShootingDistancePreset(1));
        this.dom.btnPos2.addEventListener('click', () => this.setShootingDistancePreset(2));
        this.dom.btnPos3.addEventListener('click', () => this.setShootingDistancePreset(3));

        this.dom.btnModalAction.addEventListener('click', () => {
          this.dom.modal.classList.remove('active');
          if (this.currentWin) {
            this.startLevel(this.level + 1);
          } else {
            this.startLevel(this.level);
          }
        });
      }

      /* ==========================================================================
         5. Ciclo de Jogada
         ========================================================================== */
      handleSpaceAction() {
        if (this.isGameOver) return;

        if (this.playState === 'HOLDING') {
          this.triggerJumpShoot();
        } else if (this.playState === 'WAITING_NEXT') {
          this.startNewPlay();
        }
      }

      startNewPlay() {
        this.playState = 'EMERGING';
        this.emergeProgress = 0;
        this.audio.playEmerge();

        // Nova posição aleatória na quadra (esquerda, centro ou direita)
        const positions = [-150, -100, -50, 0, 50, 100, 150];
        let newX = positions[Math.floor(Math.random() * positions.length)];
        if (newX === this.targetPlayerCourtX && positions.length > 1) {
          newX = positions[(positions.indexOf(newX) + 1) % positions.length];
        }
        this.targetPlayerCourtX = newX;

        // Desalinhamento suave: A TABELA SEMPRE NASCE VISÍVEL NA TELA!
        // Desvio visível de ~35 a 55px para um dos lados, bem perto do centro
        const signX = (Math.random() < 0.5 ? -1 : 1);
        this.calibX = Math.round(signX * (35 + Math.random() * 20));
        const signY = (Math.random() < 0.5 ? -1 : 1);
        this.calibY = Math.round(signY * (12 + Math.random() * 12));

        this.updateCalibrationMeters();

        this.aimTimer = 2.0;
        this.updateActionUI('HOLDING');
      }

      triggerJumpShoot() {
        if (this.jump.active) return;

        this.jump.active = true;
        this.jump.progress = 0;
        this.audio.playJumpShoot();

        setTimeout(() => {
          this.releaseBall();
          this.playState = 'IN_FLIGHT';
          this.updateActionUI('IN_FLIGHT');
        }, 160);
      }

      releaseBall() {
        const distZ = this.hoop.z - this.cameraZ;
        const flightTime = 0.82 + (distZ / 500) * 0.35;
        const vz = distZ / flightTime;
        const gravity = 860;

        const startX = this.playerCourtX;
        const startY = 240 + this.jump.height;
        const startZ = this.cameraZ + 40;

        // FÍSICA DIRETA REAL (Calculada a partir da mira exata da câmera - DIREÇÃO NATURAL):
        const directYaw = Math.atan2(this.hoop.x - this.cameraX, this.hoop.z - this.cameraZ);
        const yawOffset = this.calibX * 0.0035;
        const camYaw = directYaw - yawOffset;

        // O ponto exato onde a linha de visão do centro da tela cruza o plano da cesta:
        // Quando calibX = 0, camYaw == directYaw, targetX é exatamente 0 (cesta)!
        const targetX = this.playerCourtX + distZ * Math.tan(camYaw);

        // Elevação vertical (calibY = 0 acerta no aro, y = 290):
        const targetY = this.hoop.y - (this.calibY * 1.35);

        const vx = (targetX - startX) / flightTime;
        const vy = (targetY - startY + 0.5 * gravity * flightTime * flightTime) / flightTime;

        this.balls.push({
          x: startX,
          y: startY,
          z: startZ,
          vx: vx,
          vy: vy,
          vz: vz,
          radius: 19,
          pointsValue: this.currentDistancePreset,
          rotation: 0,
          rotSpeed: 7,
          scored: false,
          hitBackboard: false,
          active: true,
          fade: 1.0,
          groundBounces: 0
        });

        setTimeout(() => {
          if (this.playState === 'IN_FLIGHT') {
            this.playState = 'WAITING_NEXT';
            this.updateActionUI('WAITING_NEXT');
          }
        }, 1300);
      }

      updateActionUI(state) {
        const isDesktop = this.isDesktop;

        if (state === 'HOLDING') {
          this.dom.touchHintPill.style.display = 'inline-flex';
          this.dom.touchHintText.textContent = isDesktop
            ? 'Use as Setas para mirar • Espaço para arremessar'
            : 'Arraste para mirar • Toque em Arremessar';

          // Botão ergonômico visível no Desktop e Mobile
          this.dom.btnMainShoot.style.display = 'inline-flex';
          this.dom.btnMainShoot.className = 'btn-main-shoot shoot-mode';
          this.dom.actionIcon.className = 'bi bi-dribbble';
          this.dom.actionBtnText.textContent = isDesktop ? 'Arremessar (Espaço)' : 'Arremessar';
        } else if (state === 'IN_FLIGHT') {
          this.dom.touchHintPill.style.display = 'none';
          this.dom.btnMainShoot.style.display = 'none';
        } else if (state === 'WAITING_NEXT') {
          // Quando a bola termina o arremesso, surge o botão para nova jogada
          this.dom.touchHintPill.style.display = 'none';
          this.dom.btnMainShoot.style.display = 'inline-flex';
          this.dom.btnMainShoot.className = 'btn-main-shoot reload-mode';
          this.dom.actionIcon.className = 'bi bi-arrow-clockwise';
          this.dom.actionBtnText.textContent = isDesktop ? 'Nova Jogada (Espaço)' : 'Nova Jogada';
        }
      }

      updateCalibrationMeters() {
        if (!this.dom.meterHoriz || !this.dom.meterVert) return;
        const pctH = (this.calibX / 60) * 50;
        const clampedH = Math.max(-50, Math.min(50, pctH));
        if (clampedH >= 0) {
          this.dom.meterHoriz.style.left = '50%';
          this.dom.meterHoriz.style.width = `${clampedH}%`;
        } else {
          this.dom.meterHoriz.style.left = `${50 + clampedH}%`;
          this.dom.meterHoriz.style.width = `${Math.abs(clampedH)}%`;
        }

        const pctV = (this.calibY / 40) * 50;
        const clampedV = Math.max(-50, Math.min(50, pctV));
        if (clampedV >= 0) {
          this.dom.meterVert.style.left = '50%';
          this.dom.meterVert.style.width = `${clampedV}%`;
        } else {
          this.dom.meterVert.style.left = `${50 + clampedV}%`;
          this.dom.meterVert.style.width = `${Math.abs(clampedV)}%`;
        }
      }

      setShootingDistancePreset(pos) {
        if (this.currentDistancePreset === pos) return;
        this.currentDistancePreset = pos;
        this.audio.playJumpShoot();

        [this.dom.btnPos1, this.dom.btnPos2, this.dom.btnPos3].forEach((btn, idx) => {
          btn.classList.toggle('active', idx + 1 === pos);
        });

        if (pos === 1) this.targetCameraZ = 290;
        else if (pos === 2) this.targetCameraZ = 170;
        else if (pos === 3) this.targetCameraZ = 50;

        this.showPopupText(`Distância: ${pos} Ponto${pos > 1 ? 's' : ''}`, '#ffce00');
      }

      /* ==========================================================================
         6. Fases e Cronômetro
         ========================================================================== */
      startLevel(lvlNum) {
        this.level = lvlNum;
        const config = this.levelConfigs.find(c => c.level === lvlNum) || {
          level: lvlNum,
          name: `Nível ${lvlNum}`,
          goal: 10 + (lvlNum - 1) * 10,
          time: 60
        };

        this.levelGoal = config.goal;
        this.timeLeft = config.time;
        this.score = 0;
        this.basketsCount = 0;
        this.isGameOver = false;
        this.balls = [];

        this.startNewPlay();
        this.updateHUD();
        this.audio.playWhistle();

        if (this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
          if (this.timeLeft > 0) {
            this.timeLeft--;
            this.updateTimerDisplay();

            if (this.timeLeft === 0) {
              this.endLevel();
            }
          }
        }, 1000);
      }

      updateTimerDisplay() {
        this.dom.valTimer.textContent = this.timeLeft;
        if (this.timeLeft <= 10) {
          this.dom.chipTimer.classList.add('hurry');
        } else {
          this.dom.chipTimer.classList.remove('hurry');
        }
      }

      endLevel() {
        clearInterval(this.timerInterval);
        this.isGameOver = true;
        this.audio.playWhistle();

        const won = this.score >= this.levelGoal;
        this.currentWin = won;

        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('pedroplay_basketball_highscore', this.highScore);
        }

        if (won) {
          this.audio.playCheer();
          this.confetti.burst();
          this.dom.modalIcon.className = 'modal-icon-wrap win';
          this.dom.modalIconGlyph.className = 'bi bi-trophy-fill';
          this.dom.modalTitle.textContent = `Fase ${this.level} Concluída!`;
          this.dom.modalDesc.textContent = `Sensacional, Pedro! Você marcou ${this.score} pontos e superou a meta de ${this.levelGoal}!`;
          this.dom.modalBtnText.textContent = 'Próxima Fase';
        } else {
          this.dom.modalIcon.className = 'modal-icon-wrap try';
          this.dom.modalIconGlyph.className = 'bi bi-arrow-repeat';
          this.dom.modalTitle.textContent = 'Tempo Esgotado!';
          this.dom.modalDesc.textContent = `Muito bom treino! Você fez ${this.score} pontos. Faltaram apenas ${this.levelGoal - this.score} pontos para a meta. Vamos tentar de novo?`;
          this.dom.modalBtnText.textContent = 'Tentar Novamente';
        }

        this.dom.modalBaskets.textContent = this.basketsCount;
        this.dom.modalScore.textContent = this.score;
        this.dom.modalHigh.textContent = this.highScore;

        setTimeout(() => {
          this.dom.modal.classList.add('active');
        }, 600);
      }

      restartGame() {
        clearInterval(this.timerInterval);
        this.dom.modal.classList.remove('active');
        this.startLevel(1);
      }

      updateHUD() {
        this.dom.valScore.textContent = this.score;
        this.dom.valLevel.textContent = this.level;
        this.dom.drawerGoal.textContent = this.levelGoal;
        this.dom.drawerHigh.textContent = this.highScore;
        this.updateTimerDisplay();
      }

      showPopupText(text, color = '#ffce00') {
        const el = document.createElement('div');
        el.className = 'score-popup';
        el.textContent = text;
        el.style.color = color;
        el.style.left = `${this.centerX}px`;
        el.style.top = `${this.horizonY - 80}px`;

        document.getElementById('arena').appendChild(el);
        setTimeout(() => {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 1300);
      }

      /* ==========================================================================
         7. Projeção 3D com Yaw Angular Real e Calibragem de Câmera
         ========================================================================== */
      project3D(wx, wy, wz) {
        const camX = this.cameraX;
        const camY = 120 + this.jump.height;
        const camZ = this.cameraZ;

        // Ângulo direto até a cesta no mundo
        const directYaw = Math.atan2(this.hoop.x - camX, this.hoop.z - camZ);

        // DIREÇÃO NATURAL:
        // Arrastar para a direita (deltaX > 0) -> calibX aumenta -> tabela vai para a DIREITA!
        // Arrastar para a esquerda (deltaX < 0) -> calibX diminui -> tabela vai para a ESQUERDA!
        const yawOffset = this.calibX * 0.0035;
        const camYaw = directYaw - yawOffset;

        const dx = wx - camX;
        const dy = wy - camY;
        const dz = wz - camZ;

        const rotX = dx * Math.cos(camYaw) - dz * Math.sin(camYaw);
        const rotZ = dx * Math.sin(camYaw) + dz * Math.cos(camYaw);
        const rotY = dy;

        const fov = 420;
        const scale = fov / Math.max(1, fov + rotZ);

        // Calibragem vertical (elevação):
        // Arremessar mais alto (calibY > 0) -> câmera mira para cima -> objetos descem na tela (+pitch)
        // Arremessar mais baixo (calibY < 0) -> câmera mira para baixo -> objetos sobem na tela (-pitch)
        const pitchOffset = this.calibY * 0.85;

        const screenX = this.centerX + rotX * scale;
        const screenY = (this.horizonY + pitchOffset) - rotY * scale;

        return { x: screenX, y: screenY, scale: scale, depth: rotZ };
      }

      update(dt) {
        this.cameraZ += (this.targetCameraZ - this.cameraZ) * 6 * dt;
        this.cameraX += (this.targetPlayerCourtX - this.cameraX) * 6 * dt;
        this.playerCourtX = this.cameraX;

        if (this.playState === 'EMERGING') {
          this.emergeProgress += dt * 3.2;
          if (this.emergeProgress >= 1) {
            this.emergeProgress = 1;
            this.playState = 'HOLDING';
            this.updateActionUI('HOLDING');
          }
        }

        if (this.aimTimer > 0) {
          this.aimTimer -= dt;
        }

        if (this.jump.active) {
          this.jump.progress += dt * 3.5;
          this.jump.height = Math.sin(this.jump.progress * Math.PI) * 45;

          if (this.jump.progress >= 1) {
            this.jump.active = false;
            this.jump.progress = 0;
            this.jump.height = 0;
          }
        }

        if (this.netWave > 0) {
          this.netWave = Math.max(0, this.netWave - dt * 2.5);
        }

        const gravity = 860;

        for (let i = this.balls.length - 1; i >= 0; i--) {
          const b = this.balls[i];
          if (!b.active) continue;

          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.z += b.vz * dt;
          b.vy -= gravity * dt;
          b.rotation += b.rotSpeed * dt;

          // 1. Colisão com Tabela
          if (!b.hitBackboard && b.z >= this.hoop.backboardZ - 10 && b.vz > 0) {
            const hw = this.hoop.backboardWidth / 2;
            const hh = this.hoop.backboardHeight / 2;

            if (
              b.x >= this.hoop.x - hw &&
              b.x <= this.hoop.x + hw &&
              b.y >= this.hoop.backboardY - hh &&
              b.y <= this.hoop.backboardY + hh
            ) {
              b.z = this.hoop.backboardZ - 10;
              b.vz = -b.vz * 0.45;
              b.vx = b.vx * 0.75 + (this.hoop.x - b.x) * 0.35;
              b.hitBackboard = true;
              this.audio.playBackboard();
            }
          }

          // 2. Cesta ou Aro
          if (!b.scored && b.vy < 0) {
            const distY = Math.abs(b.y - this.hoop.y);
            const distZ = Math.abs(b.z - this.hoop.z);
            const distX = Math.abs(b.x - this.hoop.x);
            const distHoriz = Math.hypot(distX, distZ);

            if (distY < 18 && distHoriz < this.hoop.rimRadius * 0.65) {
              b.scored = true;
              this.score += b.pointsValue;
              this.basketsCount++;
              this.netWave = 1.0;

              this.audio.playSwish();
              this.showPopupText(`+${b.pointsValue} CESTA!`, b.pointsValue === 3 ? '#ffce00' : '#4ade80');
              this.updateHUD();

              b.vx *= 0.25;
              b.vz *= 0.25;
              b.vy *= 0.5;

              if (this.playState === 'IN_FLIGHT') {
                this.playState = 'WAITING_NEXT';
                this.updateActionUI('WAITING_NEXT');
              }
            } else if (distY < 18 && Math.abs(distHoriz - this.hoop.rimRadius) < 16) {
              this.audio.playRim();
              b.vy = -b.vy * 0.45;
              b.vx += (b.x > this.hoop.x ? 1 : -1) * 60;
              b.vz = -b.vz * 0.35;
            }
          }

          // 3. Chão
          if (b.y <= b.radius) {
            b.y = b.radius;
            if (Math.abs(b.vy) > 60) {
              b.vy = -b.vy * 0.6;
              b.vx *= 0.8;
              b.vz *= 0.8;
              b.groundBounces++;
              if (b.groundBounces <= 3) this.audio.playBounce();
            } else {
              b.vy = 0;
              b.vx *= 0.95;
              b.vz *= 0.95;
            }
          }

          if (b.z > 720 || b.y < 0 || (b.groundBounces > 4 && Math.abs(b.vy) < 20)) {
            b.fade -= dt * 1.5;
            if (b.fade <= 0) {
              this.balls.splice(i, 1);
            }
          }
        }
      }

      /* ==========================================================================
         8. Renderização Visual
         ========================================================================== */
      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        this.renderSunnySky();
        this.renderTreesBackground();
        this.renderOutdoorCourtFloor();
        this.renderHoop();
        this.renderBalls();
        this.renderCalibrationReticle();
        this.renderFirstPersonBasketImage();
      }

      renderSunnySky() {
        const skyGrad = this.ctx.createLinearGradient(0, 0, 0, this.horizonY);
        skyGrad.addColorStop(0, '#4a90e2');
        skyGrad.addColorStop(0.5, '#7bb5e6');
        skyGrad.addColorStop(1, '#bfe3f7');
        this.ctx.fillStyle = skyGrad;
        this.ctx.fillRect(0, 0, this.canvas.width, this.horizonY);

        this.ctx.save();
        const sunGrad = this.ctx.createRadialGradient(
          this.canvas.width * 0.22, 60, 10,
          this.canvas.width * 0.22, 60, 260
        );
        sunGrad.addColorStop(0, 'rgba(255, 255, 235, 0.9)');
        sunGrad.addColorStop(0.3, 'rgba(255, 245, 180, 0.45)');
        sunGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        this.ctx.fillStyle = sunGrad;
        this.ctx.fillRect(0, 0, this.canvas.width, this.horizonY);

        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        this.drawCloud(this.canvas.width * 0.65, 70, 70);
        this.drawCloud(this.canvas.width * 0.85, 100, 50);
        this.ctx.restore();
      }

      drawCloud(cx, cy, r) {
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, r, 0, Math.PI * 2);
        this.ctx.arc(cx - r * 0.5, cy + r * 0.2, r * 0.7, 0, Math.PI * 2);
        this.ctx.arc(cx + r * 0.5, cy + r * 0.2, r * 0.7, 0, Math.PI * 2);
        this.ctx.fill();
      }

      renderTreesBackground() {
        this.ctx.save();
        const treeBaseY = this.horizonY;

        this.ctx.fillStyle = '#3a6647';
        for (let x = 0; x <= this.canvas.width + 60; x += 55) {
          const h = 75 + Math.sin(x * 0.03) * 25;
          this.ctx.beginPath();
          this.ctx.arc(x, treeBaseY - h * 0.5, 45, 0, Math.PI * 2);
          this.ctx.fill();
        }

        this.ctx.fillStyle = '#2d5339';
        for (let x = -20; x <= this.canvas.width + 40; x += 75) {
          const h = 90 + Math.cos(x * 0.04) * 30;
          this.ctx.beginPath();
          this.ctx.arc(x, treeBaseY - h * 0.4, 52, 0, Math.PI * 2);
          this.ctx.fill();
        }
        this.ctx.restore();
      }

      renderOutdoorCourtFloor() {
        this.ctx.save();

        const courtGrad = this.ctx.createLinearGradient(0, this.horizonY, 0, this.canvas.height);
        courtGrad.addColorStop(0, '#5a423a');
        courtGrad.addColorStop(0.3, '#785549');
        courtGrad.addColorStop(1, '#4a332d');
        this.ctx.fillStyle = courtGrad;
        this.ctx.fillRect(0, this.horizonY, this.canvas.width, this.canvas.height - this.horizonY);

        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        this.ctx.lineWidth = 2.5;

        // Garrafão (Key Area) em perspectiva real
        const kFarL = this.project3D(-130, 0, 560);
        const kFarR = this.project3D(130, 0, 560);
        const kNearL = this.project3D(-130, 0, 290);
        const kNearR = this.project3D(130, 0, 290);

        this.ctx.fillStyle = 'rgba(180, 70, 50, 0.25)';
        this.ctx.beginPath();
        this.ctx.moveTo(kFarL.x, kFarL.y);
        this.ctx.lineTo(kFarR.x, kFarR.y);
        this.ctx.lineTo(kNearR.x, kNearR.y);
        this.ctx.lineTo(kNearL.x, kNearL.y);
        this.ctx.closePath();
        this.ctx.fill();
        this.ctx.stroke();

        // Linha de Lance Livre
        this.ctx.strokeStyle = '#ffce00';
        this.ctx.lineWidth = 3.5;
        this.ctx.beginPath();
        this.ctx.moveTo(kNearL.x, kNearL.y);
        this.ctx.lineTo(kNearR.x, kNearR.y);
        this.ctx.stroke();

        // Arco de Três Pontos
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        this.ctx.lineWidth = 2.5;
        this.ctx.beginPath();
        for (let a = -Math.PI / 2; a <= Math.PI / 2; a += 0.1) {
          const arcR = 380;
          const arcX = Math.sin(a) * arcR;
          const arcZ = 550 - Math.cos(a) * arcR;
          const pt = this.project3D(arcX, 0, arcZ);
          if (a === -Math.PI / 2) this.ctx.moveTo(pt.x, pt.y);
          else this.ctx.lineTo(pt.x, pt.y);
        }
        this.ctx.stroke();

        this.ctx.restore();
      }

      renderHoop() {
        const hp = this.hoop;

        const poleBottom = this.project3D(hp.x, 0, hp.backboardZ + 40);
        const poleTop = this.project3D(hp.x, hp.backboardY, hp.backboardZ + 30);

        this.ctx.save();
        this.ctx.strokeStyle = '#263238';
        this.ctx.lineWidth = 14 * poleBottom.scale;
        this.ctx.beginPath();
        this.ctx.moveTo(poleBottom.x, poleBottom.y);
        this.ctx.lineTo(poleTop.x, poleTop.y);
        this.ctx.stroke();

        const armEnd = this.project3D(hp.x, hp.backboardY - 15, hp.backboardZ);
        this.ctx.lineWidth = 8 * poleBottom.scale;
        this.ctx.strokeStyle = '#37474f';
        this.ctx.beginPath();
        this.ctx.moveTo(poleTop.x, poleTop.y);
        this.ctx.lineTo(armEnd.x, armEnd.y);
        this.ctx.stroke();

        // Tabela de Vidro em 3D Real (Foreshortening)
        const hw = hp.backboardWidth / 2;
        const hh = hp.backboardHeight / 2;

        const tl = this.project3D(hp.x - hw, hp.backboardY + hh, hp.backboardZ);
        const tr = this.project3D(hp.x + hw, hp.backboardY + hh, hp.backboardZ);
        const br = this.project3D(hp.x + hw, hp.backboardY - hh, hp.backboardZ);
        const bl = this.project3D(hp.x - hw, hp.backboardY - hh, hp.backboardZ);

        const bbGrad = this.ctx.createLinearGradient(tl.x, tl.y, br.x, br.y);
        bbGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
        bbGrad.addColorStop(0.4, 'rgba(220, 240, 255, 0.25)');
        bbGrad.addColorStop(1, 'rgba(180, 215, 245, 0.45)');

        this.ctx.fillStyle = bbGrad;
        this.ctx.beginPath();
        this.ctx.moveTo(tl.x, tl.y);
        this.ctx.lineTo(tr.x, tr.y);
        this.ctx.lineTo(br.x, br.y);
        this.ctx.lineTo(bl.x, bl.y);
        this.ctx.closePath();
        this.ctx.fill();

        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 4.5 * ((tl.scale + tr.scale) / 2);
        this.ctx.stroke();

        // Target Box
        const targetW = 68;
        const targetH = 48;
        const targetY = hp.y + 32;

        const qTL = this.project3D(hp.x - targetW / 2, targetY + targetH / 2, hp.backboardZ);
        const qTR = this.project3D(hp.x + targetW / 2, targetY + targetH / 2, hp.backboardZ);
        const qBR = this.project3D(hp.x + targetW / 2, targetY - targetH / 2, hp.backboardZ);
        const qBL = this.project3D(hp.x - targetW / 2, targetY - targetH / 2, hp.backboardZ);

        this.ctx.strokeStyle = '#e63946';
        this.ctx.lineWidth = 3.2 * ((qTL.scale + qTR.scale) / 2);
        this.ctx.beginPath();
        this.ctx.moveTo(qTL.x, qTL.y);
        this.ctx.lineTo(qTR.x, qTR.y);
        this.ctx.lineTo(qBR.x, qBR.y);
        this.ctx.lineTo(qBL.x, qBL.y);
        this.ctx.closePath();
        this.ctx.stroke();

        // Suporte do Aro
        const neckStart = this.project3D(hp.x, hp.y, hp.backboardZ);
        const neckEnd = this.project3D(hp.x, hp.y, hp.z + hp.rimRadius);
        this.ctx.strokeStyle = '#e63946';
        this.ctx.lineWidth = 5 * neckStart.scale;
        this.ctx.beginPath();
        this.ctx.moveTo(neckStart.x, neckStart.y);
        this.ctx.lineTo(neckEnd.x, neckEnd.y);
        this.ctx.stroke();

        // Aro
        const rimCenter = this.project3D(hp.x, hp.y, hp.z);
        const rimRadiusX = hp.rimRadius * rimCenter.scale;
        const rimRadiusY = hp.rimRadius * rimCenter.scale * 0.32;

        this.ctx.strokeStyle = '#e63946';
        this.ctx.lineWidth = 4.5 * rimCenter.scale;
        this.ctx.beginPath();
        this.ctx.ellipse(rimCenter.x, rimCenter.y, rimRadiusX, rimRadiusY, 0, 0, Math.PI * 2);
        this.ctx.stroke();

        this.renderNet(rimCenter, rimRadiusX, rimRadiusY);

        this.ctx.restore();
      }

      renderNet(rimCenter, rx, ry) {
        const netHeight = 50 * rimCenter.scale;
        const wave = Math.sin(performance.now() * 0.02) * 8 * this.netWave;

        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        this.ctx.lineWidth = 1.5 * rimCenter.scale;

        const strings = 12;
        const topPts = [];
        const botPts = [];

        for (let i = 0; i < strings; i++) {
          const angle = (i / strings) * Math.PI * 2;
          const tx = rimCenter.x + Math.cos(angle) * rx;
          const ty = rimCenter.y + Math.sin(angle) * ry;

          const bx = rimCenter.x + Math.cos(angle) * (rx * 0.5) + wave;
          const by = rimCenter.y + netHeight + Math.sin(angle) * (ry * 0.4);

          topPts.push({ x: tx, y: ty });
          botPts.push({ x: bx, y: by });

          this.ctx.beginPath();
          this.ctx.moveTo(tx, ty);
          this.ctx.quadraticCurveTo(
            (tx + bx) / 2 + wave * 0.5,
            (ty + by) / 2,
            bx,
            by
          );
          this.ctx.stroke();
        }

        for (let r = 0.3; r <= 0.85; r += 0.3) {
          this.ctx.beginPath();
          for (let i = 0; i <= strings; i++) {
            const idx = i % strings;
            const px = topPts[idx].x * (1 - r) + botPts[idx].x * r;
            const py = topPts[idx].y * (1 - r) + botPts[idx].y * r;
            if (i === 0) this.ctx.moveTo(px, py);
            else this.ctx.lineTo(px, py);
          }
          this.ctx.stroke();
        }

        this.ctx.restore();
      }

      renderBalls() {
        for (let b of this.balls) {
          const pt = this.project3D(b.x, b.y, b.z);
          const r = b.radius * pt.scale;

          if (r < 2) continue;

          this.ctx.save();
          this.ctx.globalAlpha = Math.max(0, Math.min(1, b.fade));

          const shadowPt = this.project3D(b.x, 0, b.z);
          const shadowR = r * 0.9;
          this.ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          this.ctx.beginPath();
          this.ctx.ellipse(shadowPt.x, shadowPt.y, shadowR, shadowR * 0.35, 0, 0, Math.PI * 2);
          this.ctx.fill();

          this.drawRotatingBasketball(pt.x, pt.y, r, b.rotation);

          this.ctx.restore();
        }
      }

      drawRotatingBasketball(cx, cy, radius, rot = 0) {
        this.ctx.save();
        this.ctx.translate(cx, cy);
        this.ctx.rotate(rot);

        const ballGrad = this.ctx.createRadialGradient(
          -radius * 0.3,
          -radius * 0.35,
          radius * 0.1,
          0,
          0,
          radius
        );
        ballGrad.addColorStop(0, '#ff8a43');
        ballGrad.addColorStop(0.65, '#f26419');
        ballGrad.addColorStop(1, '#9e3404');

        this.ctx.fillStyle = ballGrad;
        this.ctx.beginPath();
        this.ctx.arc(0, 0, radius, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.strokeStyle = '#22130b';
        this.ctx.lineWidth = Math.max(1, radius * 0.08);

        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.moveTo(-radius, 0);
        this.ctx.lineTo(radius, 0);
        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.moveTo(0, -radius);
        this.ctx.lineTo(0, radius);
        this.ctx.stroke();

        const arcOffset = radius * 0.55;
        this.ctx.beginPath();
        this.ctx.arc(-arcOffset, 0, radius * 0.8, -Math.PI / 3, Math.PI / 3);
        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.arc(arcOffset, 0, radius * 0.8, (2 * Math.PI) / 3, (4 * Math.PI) / 3);
        this.ctx.stroke();

        this.ctx.restore();
      }

      renderCalibrationReticle() {
        if (this.isGameOver) return;

        let shouldShowTarget = false;
        let targetAlpha = 1.0;

        if (this.level === 1) {
          shouldShowTarget = true;
        } else if (this.level === 2) {
          if (this.aimTimer > 0) {
            shouldShowTarget = true;
            targetAlpha = Math.min(1.0, this.aimTimer / 0.8);
          }
        }

        if (!shouldShowTarget) return;

        this.ctx.save();
        this.ctx.globalAlpha = targetAlpha;

        // O alvo (crosshair) fica fixo no ponto ideal da cesta no centro da tela:
        const distZ = this.hoop.z - this.cameraZ;
        const baseScale = 420 / (420 + distZ);
        const targetScreenX = this.centerX;
        const targetScreenY = this.horizonY - (this.hoop.y - 120) * baseScale;

        this.ctx.strokeStyle = '#ffce00';
        this.ctx.lineWidth = 2.5;
        this.ctx.beginPath();
        this.ctx.arc(targetScreenX, targetScreenY, 15, 0, Math.PI * 2);
        this.ctx.stroke();

        this.ctx.strokeStyle = '#dd0000';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        this.ctx.moveTo(targetScreenX - 22, targetScreenY);
        this.ctx.lineTo(targetScreenX - 6, targetScreenY);
        this.ctx.moveTo(targetScreenX + 6, targetScreenY);
        this.ctx.lineTo(targetScreenX + 22, targetScreenY);
        this.ctx.moveTo(targetScreenX, targetScreenY - 22);
        this.ctx.lineTo(targetScreenX, targetScreenY - 6);
        this.ctx.moveTo(targetScreenX, targetScreenY + 6);
        this.ctx.lineTo(targetScreenX, targetScreenY + 22);
        this.ctx.stroke();

        this.ctx.restore();
      }

      /* ==========================================================================
         9. Imagem Real em Primeira Pessoa (img/basket.png)
         - Redimensionada proporcionalmente para NÃO cobrir a tabela!
         - Ancorada na base com a bola situada no terço inferior.
         ========================================================================== */
      renderFirstPersonBasketImage() {
        if (this.playState === 'IN_FLIGHT' || this.playState === 'WAITING_NEXT') {
          return;
        }

        if (!this.basketImg.complete || !this.basketImg.naturalWidth) {
          return;
        }

        this.ctx.save();

        const imgNaturalW = this.basketImg.naturalWidth;
        const imgNaturalH = this.basketImg.naturalHeight;
        const aspect = imgNaturalW / imgNaturalH;

        // Proporção Mobile-First limpa: ocupa apenas 40% a 44% da tela
        const maxScaleH = this.canvas.height * (this.isDesktop ? 0.44 : 0.40);
        const drawH = Math.min(maxScaleH, 360);
        const drawW = drawH * aspect;

        const shiftX = this.calibX * 0.35;
        const shiftY = -this.calibY * 0.25;
        const idleBob = Math.sin(performance.now() * 0.003) * 2;

        const targetX = this.centerX - drawW / 2 + shiftX;
        const targetY = this.canvas.height - drawH + 12 + shiftY + idleBob;

        let currentY = targetY;

        if (this.playState === 'EMERGING') {
          const offscreenY = this.canvas.height + 40;
          currentY = offscreenY + (targetY - offscreenY) * this.emergeProgress;
        }

        this.ctx.drawImage(this.basketImg, targetX, currentY, drawW, drawH);

        this.ctx.restore();
      }

      gameLoop(now) {
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;

        this.update(dt);
        this.render();

        requestAnimationFrame((t) => this.gameLoop(t));
      }
    }

    // Inicialização ao carregar
    window.addEventListener('DOMContentLoaded', () => {
      window.gameInstance = new BasketballGame();

      try {
        const count = parseInt(localStorage.getItem('pedroplay_visits_basquete') || '0', 10) + 1;
        localStorage.setItem('pedroplay_visits_basquete', count);
      } catch (e) {}
    });
  </script>
</body>
</html>
